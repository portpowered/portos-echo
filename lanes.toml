# A crate joins this list in the change that creates it.
[[crate]]
name = "echo-mcp-auth"
path = "crates/echo-mcp-auth"
kind = "lib"

# ffi is the only kind allowed unsafe.
# Non-ffi crates use [lints] workspace = true in Cargo.toml.
# Cargo cannot combine workspace lint inheritance with local overrides.
# An ffi crate copies the workspace lint tables into its own [lints.rust]
# and [lints.clippy], changing only unsafe_code from "forbid" to "deny".
# Never use unsafe_code = "allow"; every unsafe block needs a // SAFETY: comment.
[[crate]]
name = "xtask"
path = "xtask"
kind = "tool"

