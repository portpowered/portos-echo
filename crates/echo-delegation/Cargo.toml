[package]
name = "echo-delegation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0" }
echo-agent-loop = { path = "../echo-agent-loop", version = "0.1.0" }
echo-config = { path = "../echo-config", version = "0.1.0" }
echo-codex = { path = "../echo-codex", version = "0.1.0" }
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
echo-mcp-client = { path = "../echo-mcp-client", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0", features = ["fakes"] }
echo-live = { path = "../echo-live", version = "0.1.0", features = ["fake"] }
echo-spoof-mcp = { path = "../echo-spoof-mcp", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
