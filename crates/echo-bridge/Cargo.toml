[package]
name = "echo-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-audio = { version = "0.1.0", path = "../echo-audio" }
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
echo-live = { version = "0.1.0", path = "../echo-live" }
echo-signin = { version = "0.1.0", path = "../echo-signin" }
echo-wyoming = { version = "0.1.0", path = "../echo-wyoming" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros", "io-util"] }

[dev-dependencies]
base64 = "0.23"
echo-live = { version = "0.1.0", path = "../echo-live", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process"] }
