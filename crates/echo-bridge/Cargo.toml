[package]
name = "echo-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-boot = { version = "0.1.0", path = "../echo-boot" }
echo-core-api = { version = "0.1.0", path = "../echo-core-api" }
echo-sub-call = { version = "0.1.0", path = "../echo-sub-call" }
echo-sub-device = { version = "0.1.0", path = "../echo-sub-device" }
echo-sub-pacer = { version = "0.1.0", path = "../echo-sub-pacer" }
echo-sub-session = { version = "0.1.0", path = "../echo-sub-session" }
echo-sub-trace = { version = "0.1.0", path = "../echo-sub-trace" }
echo-svc-trace = { version = "0.1.0", path = "../echo-svc-trace" }
echo-codex = { version = "0.1.0", path = "../echo-codex" }
echo-device = { version = "0.1.0", path = "../echo-device" }
echo-media = { version = "0.1.0", path = "../echo-media" }
echo-agent-api = { version = "0.1.0", path = "../echo-agent-api" }
echo-link = { version = "0.1.0", path = "../echo-link" }
echo-agent-loop = { version = "0.1.0", path = "../echo-agent-loop" }
echo-delegation = { version = "0.1.0", path = "../echo-delegation" }
echo-mcp-client = { version = "0.1.0", path = "../echo-mcp-client" }
echo-mcp-auth = { version = "0.1.0", path = "../echo-mcp-auth" }
echo-audio = { version = "0.1.0", path = "../echo-audio" }
echo-camera = { version = "0.1.0", path = "../echo-camera" }
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
echo-live = { version = "0.1.0", path = "../echo-live" }
echo-screen-contract = { version = "0.1.0", path = "../echo-screen-contract" }
echo-screen-server = { version = "0.1.0", path = "../echo-screen-server" }
echo-signin = { version = "0.1.0", path = "../echo-signin" }
echo-wyoming = { version = "0.1.0", path = "../echo-wyoming" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros", "io-util", "signal", "test-util", "process"] }
rustix = { version = "=1.1.6", features = ["fs", "mount", "process", "thread", "time"] }
base64 = "0.23"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# The configured CA bundle for the endpoint gateway: already in the tree through tokio-tungstenite and reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
allocation-counter = "0.8"
hex = "0.4"
hmac = "0.13"
echo-lab = { version = "0.1.0", path = "../echo-lab" }
p256 = { version = "0.14", features = ["ecdsa"] }
echo-link = { version = "0.1.0", path = "../echo-link", features = ["fake"] }
echo-mcp-auth = { version = "0.1.0", path = "../echo-mcp-auth", features = ["mock"] }
echo-spoof-mcp = { version = "0.1.0", path = "../echo-spoof-mcp" }
echo-live = { version = "0.1.0", path = "../echo-live", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process"] }
