[package]
name = "echo-svc-muse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.23"
echo-agent-api = { version = "0.1.0", path = "../echo-agent-api" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
ring = "0.17"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
x509-parser = "0.18"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
