[package]
name = "echo-agent-loop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0" }
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
echo-config = { path = "../echo-config", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[dev-dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0", features = ["fakes"] }
tokio = { version = "1", features = ["test-util"] }
