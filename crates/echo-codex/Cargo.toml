[package]
name = "echo-codex"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-core-api = { version = "0.1.0", path = "../echo-core-api" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }
