[package]
name = "echo-signin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-chatgpt-auth = { version = "0.1.0", path = "../echo-chatgpt-auth" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "io-util", "time", "test-util"] }
