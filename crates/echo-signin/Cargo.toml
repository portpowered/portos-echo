[package]
name = "echo-signin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-codex = { version = "0.1.0", path = "../echo-codex" }
echo-live = { version = "0.1.0", path = "../echo-live" }
echo-agent-loop = { version = "0.1.0", path = "../echo-agent-loop" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
reqwest = { version = "0.12", default-features = false }
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-chatgpt-auth = { version = "0.1.0", path = "../echo-chatgpt-auth" }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "fs"] }

[dev-dependencies]
echo-live = { version = "0.1.0", path = "../echo-live", features = ["fake"] }
echo-agent-api = { version = "0.1.0", path = "../echo-agent-api", features = ["fakes"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "io-util", "time", "test-util"] }
