[package]
name = "echo-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "echo-lab"

[lints]
workspace = true

[dependencies]
axum = "0.8"
base64 = "0.22"
p256 = { version = "0.14", features = ["ecdsa"] }
url = "2"
serde = "1"
serde_json = "1"
serde_norway = "0.9.42"
jsonschema = { version = "0.33", default-features = false }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
echo-codex = { version = "0.1.0", path = "../echo-codex" }
echo-bridge = { version = "0.1.0", path = "../echo-bridge" }
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-wyoming = { version = "0.1.0", path = "../echo-wyoming" }
echo-screen-contract = { version = "0.1.0", path = "../echo-screen-contract" }
echo-spoof-mcp = { version = "0.1.0", path = "../echo-spoof-mcp" }
echo-live = { version = "0.1.0", path = "../echo-live", features = ["fake"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "test-util", "fs"] }
tempfile = "3"

[dev-dependencies]
echo-mcp-auth = { version = "0.1.0", path = "../echo-mcp-auth" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[[bin]]
name = "echo-lab-sim-script"
path = "tests/fixtures/lab_sim_script.rs"
bench = false

[[bin]]
name = "echo-lab-sim-bridge"
path = "src/lab_sim_bridge/main.rs"
bench = false

[[bin]]
name = "echo-lab-fake-adb"
path = "tests/fixtures/lab_fake_adb.rs"
bench = false

[[bin]]
name = "echo-lab-fake-run"
path = "tests/fixtures/lab_fake_run.rs"
bench = false
