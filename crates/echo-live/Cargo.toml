[package]
name = "echo-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
fake = []

[dependencies]
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rtc = "=0.21.1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
