[package]
name = "echo-mcp-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0" }
echo-config = { path = "../echo-config", version = "0.1.0" }
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
echo-spoof-mcp = { path = "../echo-spoof-mcp", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "test-util"] }
tracing-subscriber = "0.3"
