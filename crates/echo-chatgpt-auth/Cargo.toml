[package]
name = "echo-chatgpt-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-config = { version = "0.1.0", path = "../echo-config" }
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }
