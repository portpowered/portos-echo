[package]
name = "echo-wyoming"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
loom = "0.7"
tokio = { version = "1", features = ["test-util"] }
