[package]
name = "echo-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-contracts = { version = "0.1.0", path = "../echo-contracts" }
opus = "=0.4.0"
rubato = { version = "=0.16.2", default-features = false }
sonora = { version = "=0.3.0", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[features]
# The made-up voice and room the canceller is tested against.
fixture = []

[dev-dependencies]
loom = "=0.7.3"
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
