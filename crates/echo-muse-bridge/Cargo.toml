[package]
name = "echo-muse-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
echo-agent-api = { path = "../echo-agent-api", version = "0.1.0" }
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
uuid = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[[bin]]
name = "echo-muse-fake-gadget"
path = "tests/support/fake_gadget.rs"
test = false
bench = false
