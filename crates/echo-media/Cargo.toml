[package]
name = "echo-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
webrtc = "=0.21.1"
rtc = "=0.21.1"
opus = "=0.4.0"
rubato = { version = "=5.0.0", default-features = false }
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
