[package]
name = "echo-device-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"

[build-dependencies]
cc = "=1.11.2"
