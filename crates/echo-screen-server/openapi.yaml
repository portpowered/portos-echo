openapi: 3.1.0
info: { title: Loopback screen server, version: 0.3.0 }
servers:
  - url: http://127.0.0.1:16900
paths:
  /screen-packs/v1:
    get:
      security: [{ pairingToken: [] }]
      description: Revalidated installed catalog resolved against the settings owner's accepted overlay. Supplied foreign Origin refused. No paths, tokens or submitted URLs. Revision tracks named reload publications independently of ScreenFrame.seq. Jobs expose only id, status and fixed failure reason.
      responses:
        '200':
          description: Safe catalog and effective installed identity (or null for built-in)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PackSnapshotV1' } }
        '401': { description: Missing, empty, wrong, duplicate or revoked pairing token }
        '403': { description: Supplied foreign Origin }
        '503': { description: Pack root or settings host absent, unavailable, saturated or stopping }
  /screen-packs/v1/install:
    post:
      security: [{ pairingToken: [] }]
      description: Auth, Origin and commit admission before queueing; 65536-byte JSON ceiling; background download only.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PackInstallV1' } }
      responses:
        '202':
          description: One admitted job; poll catalog for installed or safe fixed failure reason
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, job]
                properties: { version: { const: 1 }, job: { type: string } }
        '400': { description: Invalid JSON, version or unknown field; no job }
        '401': { $ref: '#/components/responses/PackUnauthorized' }
        '403': { $ref: '#/components/responses/PackForeignOrigin' }
        '413': { description: Body over 65536 bytes; no job }
        '415': { description: Requires application/json; no job }
        '422': { $ref: '#/components/responses/PackInvalid' }
        '503': { $ref: '#/components/responses/PackUnavailable' }
  /screen-packs/v1/selection:
    post:
      security: [{ pairingToken: [] }]
      description: Auth and Origin before parsing; final commit admission uses the existing single settings writer. Atomically save only screen_pack at 0600. Pack-only saves never request a voice restart; any pending voice restart remains reported. Effective selection changes publish exactly one named reload; observing that write in the settings watcher adds none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, screen_pack]
              properties:
                version: { type: integer, const: 1 }
                screen_pack: { type: string, description: Empty for built-in, template for highest installed template version, or exact validated directory identity }
      responses:
        '200':
          description: Durable selection with existing restart status
          content:
            application/json: { schema: { $ref: '#/components/schemas/SaveResultV1' } }
        '400': { description: Invalid JSON/version/shape or unknown field; no write }
        '401': { description: Invalid pairing token; no write }
        '403': { description: Supplied foreign Origin; no write }
        '413': { description: Body exceeds 65536 bytes; no write }
        '415': { description: Requires application/json; no write }
        '422':
          description: Unknown or invalid installed selection; accepted choice and file retained
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, reason]
                properties:
                  version: { type: integer, const: 1 }
                  reason: { const: invalid_selection }
        '500':
          description: Existing writer's fixed persistence diagnostic, including explicit post-rename durability uncertainty
          content:
            application/json: { schema: { $ref: '#/components/schemas/SettingsErrorV1' } }
        '503': { description: Pack root or settings host unavailable, saturated or stopping; no queued retry }
  /screen-packs/v1/{pack}/{file}:
    get:
      security: [{ pairingToken: [] }]
      description: Normalized nested file in a revalidated local pack; canonical screens root, regular allowlisted files only. CSS selectors are scoped to .screen-pack and local image URLs acquire the pairing token. No-store and no-referrer on every response.
      parameters:
        - { in: path, name: pack, required: true, schema: { type: string } }
        - { in: path, name: file, required: true, schema: { type: string } }
        - { in: header, name: Range, schema: { type: string, description: One bytes=start-end, start- or -suffix range } }
      responses:
        '200':
          description: Exact validated bytes (CSS rewritten for safe scoped use)
          headers:
            Accept-Ranges: { schema: { const: bytes } }
            Content-Length: { schema: { type: integer } }
          content:
            application/json: { schema: { type: string } }
            text/css: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        '206':
          description: Exact selected bytes with Content-Length, Accept-Ranges and Content-Range bytes start-end/total
        '401': { description: Missing, wrong, empty, duplicate or revoked token; empty body }
        '404': { description: Missing or invalid pack, normalized path, MIME type, symlink, hardlink or canonical root; empty body }
        '416':
          description: Malformed, multiple or unsatisfiable range; Content-Range bytes */total, empty body
        '503': { description: Pack host absent, stopping, draining or read capacity exhausted; empty body }
  /:
    get:
      description: Existing events/actions bootstrap query grammar; fixed echo-settings v1 meta capability only when a home-backed settings inbox is mounted
      responses:
        '200':
          description: Existing page, no state or token injected; no-inbox HTML bytes unchanged
          content:
            text/html: { schema: { type: string } }
  /screen.css:
    get:
      responses:
        '200':
          description: Existing stylesheet
          content:
            text/css: { schema: { type: string } }
  /screen.js:
    get:
      responses:
        '200':
          description: Bundle produced by web/screen/tools/build.mjs
          content:
            text/javascript: { schema: { type: string } }
        '503': { description: Bundle unavailable; no fallback or state }
  /events:
    get:
      security: [{ pairingToken: [] }]
      description: Current ordinary frame if present, then ordered updates; no history replay; revocation closes streams. Effective pack selection commits and settled external settings changes emit screen-pack-reload with PackReloadV1 data once per change. Each new install publishes once before installed status. No-op, alias, duplicate install and failed mutations emit nothing. Active pack-file watching remains pending. Reconnect fetches the catalog for current pack revision.
      responses:
        '200':
          description: Unnamed messages contain canonical ScreenFrame JSON. Named screen-pack-reload messages contain PackReloadV1 JSON and do not consume ScreenFrame.seq. Each message ends with two newlines.
          content:
            text/event-stream:
              schema: { type: string }
              example: 'data: {"seq":1,"state":{"state":"ready","message":"Echo Live ready"}}'
        '401': { description: Missing, wrong, empty, duplicate or revoked token; empty body, no state }
        '503': { description: Stream capacity exhausted or stopping; empty body }
  /actions:
    post:
      security: [{ pairingToken: [] }]
      description: Auth before parsing; enqueue only; no execution/retry; supplied foreign Origin refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/screen/ui_action.json
      responses:
        '204': { description: Exact UiAction queued once on returned receiver }
        '400': { description: Malformed JSON or invalid UiAction; nothing queued }
        '401': { description: Missing, wrong, empty, duplicate or revoked token; empty body, nothing queued }
        '403': { description: Supplied Origin differs from loopback server origin; nothing queued }
        '413': { description: Body exceeds 65536 bytes; nothing queued }
        '415': { description: Content-Type is not application/json; nothing queued }
        '503': { description: Action queue full or receiver closed; nothing queued }
  /settings/v1:
    get:
      security: [{ pairingToken: [] }]
      description: Authorized non-secret snapshot; supplied foreign Origin refused. No settings host means 503. Never returns paths or credentials.
      responses:
        '200':
          description: Effective editable values, last accepted prompt texts, version and Port OS link status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsSnapshotV1' }
        '401': { description: Missing, wrong, empty, duplicate or revoked token; empty body }
        '403': { description: Supplied Origin differs from server origin; empty body }
        '503': { description: Settings host absent, stopping, saturated or unavailable; empty body }
    post:
      security: [{ pairingToken: [] }]
      description: Auth and Origin before parsing, rechecked at commit admission. Merge sparse patch into accepted overlay, validate effective config with echo-config, atomically replace settings.toml at 0600. No bridge.toml write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatchV1' }
      responses:
        '200':
          description: Durably saved; restart_pending is false for an effective no-op and true for a queued settings restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResultV1' }
        '400': { description: Malformed JSON, wrong version, empty patch, unknown key or invalid shape; nothing written }
        '401': { description: Invalid or revoked pairing token; empty body, nothing written }
        '403': { description: Supplied foreign Origin; empty body, nothing written }
        '413': { description: JSON body exceeds 65536 bytes; nothing written }
        '415': { description: Content-Type is not application/json; nothing written }
        '422':
          description: echo-config refuses effective candidate; unchanged file; safe exact validation message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV1' }
        '500':
          description: Persistence failed; previous file retained for pre-rename failure; post-rename durability uncertainty explicitly reported, never a false rollback claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV1' }
        '503': { description: Settings host absent, stopping, saturated or closed before commit; no queued retry }
  /settings/v2:
    get:
      security: [{ pairingToken: [] }]
      description: Accepted non-secret settings plus a passive Port OS projection and pending restart state. Success is no-store.
      responses:
        '200':
          description: Version 2 settings snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsSnapshotV2' }
        '401': { description: Invalid or revoked pairing token; empty body }
        '403': { description: Supplied foreign Origin; empty body }
        '503': { description: Settings host absent, stopping or saturated; empty body }
    patch:
      security: [{ pairingToken: [] }]
      description: Sparse save with auth checked before decoding and again at commit. Successful permission withdrawals apply before the receipt. Uses the existing atomic 0600 settings.toml writer and idle restart gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatchV2' }
      responses:
        '200':
          description: Accepted save; restart_pending reports the pending boundary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResultV2' }
        '400': { description: Malformed JSON, wrong version, empty patch or section, unknown key or nonconforming shape; nothing written }
        '401': { description: Invalid or revoked pairing token; empty body }
        '403': { description: Supplied foreign Origin; empty body }
        '413': { description: JSON body exceeds 65536 bytes; nothing written }
        '415': { description: Content-Type is not application/json; nothing written }
        '422':
          description: Effective candidate rejected; previous accepted config retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV2' }
        '500':
          description: Fixed persistence error; uncertainty disclosed if rename already occurred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV2' }
        '503': { description: Settings host absent, stopping or saturated; no queued retry }
  /settings/v2/openai:
    get:
      security: [{ pairingToken: [] }]
      description: Read the OpenAI account state and any active public device-code challenge. No credential or account identity is returned.
      responses:
        '200':
          description: Account state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAiAccountV2' }
        '401': { description: Pairing token refused }
        '403': { description: Foreign Origin refused }
        '503': { description: Settings owner unavailable }
    post:
      security: [{ pairingToken: [] }]
      description: Start one OpenAI link or confirmed unlink through the existing Codex owner. The current voice session settles before the account operation runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortosOperationV2' }
      responses:
        '202':
          description: Operation accepted. Read the account state for completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortosOperationStartedV2' }
        '400': { description: Invalid operation or missing unlink confirmation }
        '401': { description: Pairing token refused }
        '403': { description: Foreign Origin refused }
        '409': { description: Operation conflicts with current account state }
        '413': { description: Request too large }
        '415': { description: JSON required }
        '503': { description: Settings owner unavailable }
  /settings/v2/portos:
    post:
      security: [{ pairingToken: [] }]
      description: Admit a single operation with the existing runtime grant owner. Read GET /settings/v2 for progress and completion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortosOperationV2' }
      responses:
        '202':
          description: Operation admitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortosOperationStartedV2' }
        '400': { description: Invalid request shape or missing unlink confirmation; no operation }
        '401': { description: Invalid or revoked pairing token; empty body }
        '403': { description: Supplied foreign Origin; empty body }
        '409':
          description: Owner busy or accepted scopes waiting for restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV2' }
        '413': { description: JSON body exceeds 65536 bytes; no operation }
        '415': { description: Content-Type is not application/json; no operation }
        '422':
          description: Port OS unconfigured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV2' }
        '503': { description: Settings host or grant owner unavailable; no queued retry }
  /settings/v1/prompts/{kind}:
    post:
      security: [{ pairingToken: [] }]
      description: Same auth, Origin, media and commit admission as settings. Prompt JSON-body limit is 196672 bytes (six-byte JSON escapes per maximum UTF-8 byte plus envelope). Atomic 0600 write to the selected fixed prompt file; no restart.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [voice, runner] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, text]
              properties:
                version: { type: integer, const: 1 }
                text: { type: string, description: Nonblank UTF-8, 1..32768 bytes, preserved exactly; byte limit enforced after JSON decoding }
      responses:
        '200':
          description: Prompt durably saved; restart_pending is false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveResultV1' }
        '400': { description: Invalid JSON/version/shape/unknown property; no write }
        '401': { description: Invalid or revoked token; empty body, no write }
        '403': { description: Supplied foreign Origin; empty body, no write }
        '404': { description: Unknown prompt kind; no arbitrary file path }
        '413': { description: Encoded JSON body exceeds 196672 bytes; no write }
        '415': { description: Content-Type is not application/json; no write }
        '422':
          description: Empty, whitespace-only or over-32768-byte prompt; safe named validation error, old file retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV1' }
        '500':
          description: Persistence failed; fixed diagnostic and explicit durability uncertainty after rename
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsErrorV1' }
        '503': { description: Settings host absent, stopping, saturated or closed before commit; no retry }
components:
  securitySchemes:
    pairingToken: { type: apiKey, in: query, name: token }
  schemas:
    PackInstallV1:
      type: object
      additionalProperties: false
      required: [version, url, sha256]
      properties:
        version: { const: 1 }
        url: { type: string, format: uri, description: HTTPS only in production; no userinfo or fragment }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    PackErrorV1:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { const: 1 }
        reason:
          enum: [invalid_url, invalid_sha256, download_failed, download_timeout, tls_failed, checksum_mismatch, unsafe_path, link_entry, special_entry, duplicate_entry, expanded_size_limit, file_count_limit, clip_size_limit, invalid_manifest, unsafe_css, invalid_selection, install_failed, durability_uncertain]
    PackSnapshotV1:
      type: object
      additionalProperties: false
      required: [version, revision, active, installed, jobs, warning]
      properties:
        version: { type: integer, const: 1 }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        active: { type: [string, 'null'] }
        installed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, version, manifest_url, rest_url]
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: string }
              manifest_url: { type: string, description: Same-origin relative URL without token; caller appends pairing token }
              rest_url: { type: [string, 'null'], description: Null for layout-only packs }
        jobs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status, reason]
            properties:
              id: { type: string }
              status: { enum: [queued, downloading, installed, failed] }
              reason:
                anyOf:
                  - { type: 'null' }
                  - { $ref: '#/components/schemas/PackErrorV1/properties/reason' }
        warning: { type: [string, 'null'], enum: [null, invalid_selection] }
    PackReloadV1:
      type: object
      additionalProperties: false
      required: [version, revision, active]
      properties:
        version: { const: 1 }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        active: { type: [string, 'null'] }
    SettingsValuesV1:
      type: object
      additionalProperties: false
      required: [voice, codex, agent]
      properties:
        voice:
          type: object
          additionalProperties: false
          required: [session_listen_enabled, session_listen_seconds]
          properties:
            session_listen_enabled: { type: boolean }
            session_listen_seconds: { type: integer, minimum: 3, maximum: 300 }
        codex:
          type: object
          additionalProperties: false
          required: [voice]
          properties:
            voice: { type: string, description: default or a name from allowed_voices; echo-config is authoritative }
        agent:
          type: object
          additionalProperties: false
          required: [daily_request_cap, max_tool_calls]
          properties:
            daily_request_cap: { type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19, description: Lossless unsigned decimal; maximum TOML integer 9223372036854775807; zero refuses new admissions }
            max_tool_calls: { type: integer, minimum: 1, maximum: 32 }
    SettingsPatchV1:
      type: object
      additionalProperties: false
      required: [version, settings]
      properties:
        version: { type: integer, const: 1 }
        settings:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            voice:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                session_listen_enabled: { type: boolean }
                session_listen_seconds: { type: integer, minimum: 3, maximum: 300 }
            codex:
              type: object
              additionalProperties: false
              required: [voice]
              properties:
                voice: { type: string, description: Validated by echo-config against its pinned allowed list }
            agent:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                daily_request_cap: { type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19 }
                max_tool_calls: { type: integer, minimum: 1, maximum: 32 }
    SettingsSnapshotV1:
      type: object
      additionalProperties: false
      required: [version, settings, allowed_voices, prompts, link_status, bridge_version, restart_pending, warnings]
      properties:
        version: { type: integer, const: 1 }
        settings: { $ref: '#/components/schemas/SettingsValuesV1' }
        allowed_voices: { type: array, items: { type: string }, description: default plus the existing echo-config pinned list; no independently maintained UI list }
        prompts:
          type: object
          additionalProperties: false
          required: [voice, runner]
          properties:
            voice: { type: string }
            runner: { type: string }
        link_status: { type: string, enum: [unconfigured, link_required, linked] }
        bridge_version: { type: string }
        restart_pending: { type: boolean }
        warnings: { type: array, items: { type: string }, description: Fixed payload-free diagnostics, including ignored settings.toml }
    SaveResultV1:
      type: object
      additionalProperties: false
      required: [version, restart_pending]
      properties:
        version: { type: integer, const: 1 }
        restart_pending: { type: boolean }
    SettingsErrorV1:
      type: object
      additionalProperties: false
      required: [version, message]
      properties:
        version: { type: integer, const: 1 }
        message: { type: string, description: Trusted field/file name and fixed category only; never submitted values or absolute paths }
    SettingsSnapshotV2:
      $ref: ../../schemas/screen/settings_snapshot_v2.json
    SettingsPatchV2:
      $ref: ../../schemas/screen/settings_patch_v2.json
    SaveResultV2:
      $ref: ../../schemas/screen/save_result_v2.json
    SettingsErrorV2:
      $ref: ../../schemas/screen/settings_error_v2.json
    PortosOperationV2:
      $ref: ../../schemas/screen/portos_operation_v2.json
    PortosOperationStartedV2:
      $ref: ../../schemas/screen/portos_operation_started_v2.json
    OpenAiAccountV2:
      $ref: ../../schemas/screen/openai_account_v2.json
  responses:
    PackUnauthorized: { description: Missing, wrong, empty, duplicate or revoked token; empty body, no effect }
    PackForeignOrigin: { description: Supplied Origin differs from server origin; empty body, no effect }
    PackUnavailable: { description: Pack host absent, stopping, saturated or cancelled before commit; no retry }
    PackInvalid:
      description: Safe fixed validation category; old selection/files retained
      content:
        application/json: { schema: { $ref: '#/components/schemas/PackErrorV1' } }
