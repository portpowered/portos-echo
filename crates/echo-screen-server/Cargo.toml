[package]
name = "echo-screen-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
echo-screen-contract = { path = "../echo-screen-contract", version = "0.1.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
portos-tokens = { path = "../../third_party/portos-tokens", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "io-std", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "process"] }
