[package]
name = "echo-screen-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
echo-contracts = { path = "../echo-contracts", version = "0.1.0" }
echo-screen-contract = { path = "../echo-screen-contract", version = "0.1.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "io-std", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
