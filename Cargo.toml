[workspace]
resolver = "3"
members = ["xtask", "crates/echo-lab", "crates/echo-config", "crates/echo-screen-contract", "crates/echo-contracts", "crates/echo-agent-api", "crates/echo-audio", "crates/echo-live", "crates/echo-mcp-auth", "crates/echo-wyoming", "crates/echo-agent-loop", "crates/echo-mcp-client", "crates/echo-spoof-mcp"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
