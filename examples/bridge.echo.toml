# echo-bridge running ON the Echo, beside hassmic (W4). No PC is in the path.
# Every path is a placeholder. All credential values are paths; loading this file opens none of them.
# The launch contract the fork's service script must meet is in docs/architecture.md
# ("Launch contract on the Echo"). /data/local/echo-bridge/private is a mode-0700 directory
# owned by the bridge's user: the script creates it; the bridge creates what is inside it.
wake_earcon = true

# hassmic listens for Wyoming on loopback on the same device.
[echo]
host = "127.0.0.1"
wyoming_port = 16700

[live]
mode = "chatgpt"
credential_file = "/data/local/echo-bridge/private/live.json"
voice = "default"
session_idle_seconds = 120

[codex]
# Provider-backed read-only search: live (default), cached, or disabled.
web_search = "live"
# The bridge creates this home with mode 0700 and refuses one whose mode differs.
home = "/data/local/echo-bridge/private/codex-home"
# `make build-codex-armv7` produces a standalone app server, not the `codex` multi-tool:
# it takes no `app-server` subcommand. Omitted, launch is "subcommand".
binary = "/data/local/echo-bridge/codex-app-server"
launch = "standalone"
# The child starts with a cleared environment and the Echo has no system bundle it can find.
# This PEM file reaches the child as SSL_CERT_FILE and supplies explicit additional
# trust roots to the bridge's Port OS OAuth and MCP HTTPS clients.
# Omitted, no certificate variable or additional trust roots are set.
ca_file = "/data/local/echo-bridge/cacert.pem"

[agent]
max_tool_calls = 8
task_deadline_seconds = 60
daily_request_cap = 500

# Public pilot endpoints; replace with your deployment's MCP resource URL.
# Issuer is discovered and validated, not a config key:
# https://auth.portoperatingsystem.com
# The bridge creates portos/ as 0700 and grant.json as 0600.
[mcp]
state_dir = "/data/local/echo-bridge/private/portos"
client_id = "port1/systems/zero/oauth-clients/command-line-interface"
scopes = ["endpoint:read"]
operator_listen = "127.0.0.1:16902"

[[mcp.server]]
name = "portos"
url = "https://api.portoperatingsystem.com/mcp"
auth = "portos_device_code"
allow_tools = ["endpoint_list", "endpoint_query", "control"]

# The screen app on the same device loads the page from loopback; nothing on the LAN reaches it.
# WebRTC's echo canceller (AEC3) takes the reply's own echo out of the microphone before it
# goes upstream. echo_delay_ms is only where it looks first: reply.quality reports the delay it found.
[audio]
echo_cancel = true
echo_delay_ms = 240 # Integer 0..800.

[screen]
listen = "127.0.0.1:16900"
pairing_token_file = "/data/local/echo-bridge/private/screen-pairing.txt"

# Created by the bridge with mode 0700, and the files in it with mode 0600, whatever the umask.
[audit]
log_dir = "/data/local/echo-bridge/private/audit"

# Non-secret agent home, separate from private credentials.
[home]
dir = "/data/local/echo-bridge/home"
agent_tools = true
# false or [] disables local tools; ["notes"] or ["prompts"] selects one group.
# Copy examples/prompts/voice.md and runner.md into this home's prompts directory.
# Edits apply to new conversations; missing files use built-ins, bad edits retain prior text.
# settings.toml is reserved; the prompt loader never reads or writes it.
