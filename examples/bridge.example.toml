# All credential values are paths; this example contacts no services when loaded.
# Optional wake acknowledgement; omitted means true. Set false to disable.
wake_earcon = true

[echo]
host = "echo.example.invalid"
wyoming_port = 16700

[live]
mode = "chatgpt"
credential_file = "credentials/live.json"
voice = "default"
session_idle_seconds = 120

# Optional Codex settings. Uncomment [codex] and the settings you want to use.
# Base instructions are files in the optional agent home: prompts/runner.md for thread/start,
# prompts/voice.md for the Live prompt. Each new call appends the same UTC context snapshot.
# With no home, built-in defaults remain: conversation first, a hand-off as the exception.
# Optional keys in that same codex table; all default to unset:
# [codex]
# Owner skills are read from [home].dir/skills/<name>/SKILL.md. Omit or use [] to disable.
# Skill files in the private Codex home are unsupported.
# skills = ["brief"]
# delegate_model = "fixture-model"
# delegate_effort = "low"
# delegate_speed = "standard" # standard, fast (priority) or ultrafast (GPT-6 Astra or GPT-6.1 Sol).
# Sets the operator's IANA time zone for time answers. Run `adb shell getprop persist.sys.timezone` to see the device zone.
# time_zone = "America/Los_Angeles"
# delegate_model selects the Codex thread model used by delegated turns.
# Precedence: delegate_model, codex.model, agent.model, then the bridge's default, gpt-6.1-sol.
# It does not select the realtime audio model. gpt-6.2-* models currently refuse the direct web.run
# that search needs (HTTP 400; decisions 2026-11-21); delegate_effort = "low" is the recommended setting.
# delegate_effort sets thread/start config.model_reasoning_effort.
# The pin recognises none/minimal/low/medium/high/xhigh/max/ultra/persistent.
# It also accepts custom nonempty strings; model support is checked at runtime.
# time_zone is checked for IANA-name syntax only, without a time-zone database.
# Unknown syntax-valid names are accepted, including single-component UTC.
# It adds the zone name and an answer-in-that-zone instruction to the UTC snapshot.
# Unset time_zone keeps UTC wording; the bridge does not compute local time or DST.
# launch = "standalone" starts codex.binary without the `app-server` subcommand (the armv7 app-server
# build); it requires binary. Unset is "subcommand". ca_file = "/absolute/ca.pem" reaches the app
# server as SSL_CERT_FILE; unset passes nothing. See examples/bridge.echo.toml for both in use.
# Remove these new keys before rolling back to a binary that predates them.

[agent]
daily_request_cap = 500

[[mcp.server]]
name = "local-test"
url = "http://127.0.0.1:18080/mcp"
auth = "none"
allow_tools = ["test.echo"]
# auth = "bearer_file" requires a bearer_file path.

[screen]
listen = "0.0.0.0:16900"
pairing_token_file = "credentials/screen-pairing.txt"
# Lip sync: milliseconds from a reply frame's hand-off until the Echo's speaker plays it.
# mouth_delay_ms = 40

# Duplex run listening after activity/reply. This differs from live.session_idle_seconds,
# which retains the Live call between separate wake runs. Omitted table/keys use these defaults.
# Remove this table before rolling back to a binary that predates voice configuration.
[voice]
session_listen_seconds = 15 # Integer 3..300.
session_max_seconds = 600 # Integer 3..2147483647, at least listen; bounds delegated waiting and tool-granted listening extensions.
speech_start_expiry_seconds = 20 # Integer 3..300; a speech start with no transcript text stops counting as speech after this.
local_barge_cut = true # Boolean; false leaves barge-in to the Live model's own yield (no local hold or cut).

# Private delegation payload capture. Restart to apply; remove this table before rollback.
[trace]
payloads = true

[audit]
log_dir = "logs/audit"

# Optional non-secret agent home (absolute path; no environment expansion).
# [home]
# dir = "/tmp/echo-bridge-home"
# Copy examples/prompts/{voice,runner}.md to <home>/prompts/ and edit there.
# New calls/threads reload; retained calls keep their original text.
# Missing files use built-ins once-traced; invalid reloads keep the last valid text.
# codex.instructions and codex.live_instructions are removed; use the files above.
# settings.toml is reserved for screen settings; this prompt loader never opens it.
