# All credential values are paths; this example contacts no services when loaded.
# Optional wake acknowledgement; omitted means true. Set false to disable.
wake_earcon = true

[echo]
host = "echo.example.invalid"
wyoming_port = 16700

[live]
mode = "chatgpt"
credential_file = "credentials/live.json"
voice = "default"
session_idle_seconds = 120

# Optional Codex instructions (add a table named codex to customize):
# instructions is the delegated turn's base text only (thread/start baseInstructions).
# Each new call receives a delimited snapshot after these instructions and after the Live prompt.
# The authorized fallback explicitly labels UTC when local offset is unavailable.
# instructions = """Client audio bridge"""
# live_instructions is the GPT-Live prompt (thread/realtime/start prompt); neither key falls back to
# the other. Unset uses this built-in default: conversation first, a hand-off as the exception.
# live_instructions = """You are a friendly voice assistant on a smart speaker. Conversation is the default: answer directly and briefly from the conversation, the call-start context and your own general knowledge. Greetings, small talk, opinions, explanations, general knowledge and arithmetic never need the background agent; do not hand off just to check or verify something you can answer. Hand off to the background agent only when the request truly needs a tool: an action on a device or service, or live or personal data you do not have. If you are unsure whether a tool is needed, answer or ask a short question instead of handing off. After a hand-off, say one short acknowledgement and wait for its result; never hand off the same request twice. The context is a call-start snapshot; UTC does not establish the user's local time zone."""
# Optional keys in that same codex table; all default to unset:
# delegate_model = "fixture-model"
# delegate_effort = "low"
# time_zone = "Europe/Berlin"
# delegate_model selects the Codex thread model used by delegated turns.
# Precedence: delegate_model, codex.model, agent.model, then the pin's default.
# It does not select the realtime audio model. Unset keeps the pin's default, the measured choice
# (decisions 2026-11-17); delegate_effort = "low" is the recommended setting.
# delegate_effort sets thread/start config.model_reasoning_effort.
# The pin recognises none/minimal/low/medium/high/xhigh/max/ultra/persistent.
# It also accepts custom nonempty strings; model support is checked at runtime.
# time_zone is checked for IANA-name syntax only, without a time-zone database.
# Unknown syntax-valid names are accepted, including single-component UTC.
# It adds the zone name and an answer-in-that-zone instruction to the UTC snapshot.
# Unset time_zone keeps UTC wording; the bridge does not compute local time or DST.
# launch = "standalone" starts codex.binary without the `app-server` subcommand (the armv7 app-server
# build); it requires binary. Unset is "subcommand". ca_file = "/absolute/ca.pem" reaches the app
# server as SSL_CERT_FILE; unset passes nothing. See examples/bridge.echo.toml for both in use.
# Remove these new keys before rolling back to a binary that predates them.

[agent]
max_tool_calls = 8
task_deadline_seconds = 60
daily_request_cap = 500

[[mcp.server]]
name = "local-test"
url = "http://127.0.0.1:18080/mcp"
auth = "none"
allow_tools = ["test.echo"]
# auth = "bearer_file" requires a bearer_file path.

[screen]
listen = "0.0.0.0:16900"
pairing_token_file = "credentials/screen-pairing.txt"

# Duplex run listening after activity/reply. This differs from live.session_idle_seconds,
# which retains the Live call between separate wake runs. Omitted table/keys use these defaults.
# Remove this table before rolling back to a binary that predates voice configuration.
[voice]
session_listen_seconds = 15 # Integer 3..300.
session_max_seconds = 600 # Integer 3..2147483647, at least listen; bounds tool-granted waiting.

[audit]
log_dir = "logs/audit"
