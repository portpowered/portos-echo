name: Settings wire generation
on:
  push:
    branches: [el-w5-screen-settings-panel-schema-witness]
permissions:
  contents: read
jobs:
  settings-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: settings-wire
      - name: Generate Rust and TypeScript settings schemas
        run: |
          UPDATE_SCHEMAS=1 cargo test --offline --locked -p echo-screen-contract --test screen_schema settings_v2_schema_snapshots
          npm --prefix web/screen ci --offline=false
          npm --prefix web/screen run generate:schema
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settings-wire
          path: |
            schemas/screen/*_v2.json
            web/screen/src/settings/model.ts
          retention-days: 3
      - name: Check the generated wire
        run: |
          cargo test --offline --locked -p echo-screen-contract --test screen_wire -- --nocapture
          cargo test --offline --locked -p echo-screen-contract --test screen_schema
          npm --prefix web/screen run check:schema

  settings-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
      - run: npm --prefix web/screen ci --offline=false
      - name: Exercise paired settings and live tool admission
        run: |
          cargo nextest run --locked --no-fail-fast -p echo-bridge -p echo-screen-server -p echo-config -E 'test(screen_settings_store_) | test(t3_settings_) | package(echo-config)' --no-capture
      - name: Check focus packages for lint regressions
        if: always()
        run: cargo clippy --offline --locked -p echo-config -p echo-screen-contract -p echo-screen-server -p echo-bridge --all-targets -- -D warnings

      - run: make lint-shape
  settings-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix web/screen ci --offline=false
      - run: npx --prefix web/screen playwright install --with-deps chromium
      - run: npm --prefix web/screen run build
      - name: Exercise the bundled settings and screen packs in Chromium
        working-directory: web/screen
        run: node --test --test-timeout=30000 tests/render.test.mjs
      - run: npm --prefix web/screen run lint
