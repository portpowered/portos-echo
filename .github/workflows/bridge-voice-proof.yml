name: Bridge voice focused proof
on:
  push:
    branches: [scratch/bridge-voice-trace-proof]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git switch --detach e880e5295d604899aa98a8d6fe76781e53a7d742
      - uses: ./.github/actions/setup
        with:
          target: test-sim
      - name: E-VOICE, E-WARNING and E-REG
        run: |
          set -ex
          git rev-parse HEAD
          cargo build --locked -p echo-bridge -p echo-lab -p echo-muse-bridge --bins
          cargo test --locked -p echo-bridge --test bridge_t3 t3_voice_overlay_ -- --ignored --nocapture --test-threads=1
          cargo test --locked -p echo-bridge --test bridge_t3 t3_settings_overlay_invalid_startup_reports_and_ignores_entire_file -- --ignored --nocapture --test-threads=1
          cargo test --locked -p echo-bridge --lib voice_config_tests
          cargo test --locked -p echo-bridge --lib voice_config::tests::
          cargo test --locked -p echo-bridge --lib call_omitted_voice_uses_server_default_without_null_or_legacy_substitution
          cargo test --locked -p echo-config --test config_load config_settings
          cargo test --locked -p echo-bridge --lib settings
          cargo test --locked -p echo-bridge --test bridge_t3 codex_operator::configured:: -- --ignored --test-threads=1
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git switch --detach e880e5295d604899aa98a8d6fe76781e53a7d742
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Provision existing lint dependencies
        run: |
          npm --prefix web/screen ci --offline=false
          cargo deny fetch
          directory=$(mktemp -d)
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$directory/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $directory/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          sudo install "$directory/gitleaks" /usr/local/bin/gitleaks
      - name: E-LINT
        run: |
          set -ex
          git rev-parse HEAD
          make lint
