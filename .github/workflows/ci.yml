name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: sh
jobs:
  test-unit-rust:
    name: test-unit-rust ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/portos-echo/codex
          key: codex-${{ runner.os }}-${{ hashFiles('codex.pin') }}
      - name: Provision verified pinned Codex
        run: sh scripts/codex-app-server.sh
      - name: Enable isolated Codex network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test-unit-rust
        run: make test-unit-rust NEXTEST_PARTITION=count:${{ matrix.shard }}/4
  test-unit-screen:
    name: test-unit-screen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-screen
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Provision pinned screen Chromium
        run: cd web/screen && npx --offline playwright install --with-deps chromium
      - name: Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test-unit-screen
        run: make test-unit-python test-unit-screen
      - name: Publish screen screenshot evidence
        if: always()
        id: screen-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screen-evidence-${{ github.sha }}
          path: |
            web/screen/test-results/screenshots/**
            web/screen/test-results/summary.txt
          if-no-files-found: error
  test-sim-scenarios-shards:
    name: test-sim-scenarios ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: test-sim-suites
        run: make test-sim-scenarios SCENARIO_PARTITION=${{ matrix.shard }}/2
  test-sim-suites-parts:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [test-sim-bridge, test-sim-components]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: test-sim-suites
        run: make ${{ matrix.part }}
  test-sim-host-shards:
    name: test-sim-host ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-host
          sim: 'true'
      - name: test-sim-host
        run: make test-sim-host NEXTEST_PARTITION=count:${{ matrix.shard }}/3
  build-host-workspace:
    name: build-host-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-host
      - name: build-host-workspace
        run: make build-host-workspace
  test-echo-install:
    name: test-echo-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: test-echo-install
        run: make test-echo-install
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: fmt-check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: format
        run: make fmt-check
  lint-rust:
    name: lint-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: lint-rust
        run: make lint-rust
  lint-shape:
    name: lint-shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-shape
      - name: lint-shape
        run: make lint-shape
  lint-deps:
    name: lint-deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - name: lint-deps
        run: make lint-deps
  lint-rules:
    name: lint-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: lint-rules
        run: make lint-rules
  lint-scripts-web:
    name: lint-scripts-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-scripts-web
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: lint-scripts-web
        run: make lint-scripts-web
  lint-docs:
    name: lint-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-docs
      - name: lint-docs
        run: make lint-docs
  lint-ci-parity:
    name: lint-ci-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-ci-parity
      - name: lint-ci-parity
        run: make lint-ci-parity
  lint-self-tests:
    name: lint-self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - name: lint-self-tests
        run: make lint-self-tests
  test-unit:
    name: test-unit
    needs: [test-unit-rust, test-unit-screen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test-unit
        run: test '${{ needs.test-unit-rust.result }}' = success && test '${{ needs.test-unit-screen.result }}' = success
  test-contract:
    name: test-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-contract
      - name: test-contract
        run: make test-contract
  test-sim-suites:
    name: test-sim-suites
    needs: [test-sim-scenarios-shards, test-sim-suites-parts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test-sim-suites
        run: test '${{ needs.test-sim-scenarios-shards.result }}' = success && test '${{ needs.test-sim-suites-parts.result }}' = success
  test-sim-host:
    name: test-sim-host
    needs: [test-sim-host-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test-sim-host
        run: test '${{ needs.test-sim-host-shards.result }}' = success
  test-concurrency:
    name: test-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-concurrency
      - name: test-concurrency
        run: make test-concurrency
  build-host:
    name: build-host
    needs: [build-host-workspace, test-echo-install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: build-host
        run: test '${{ needs.build-host-workspace.result }}' = success && test '${{ needs.test-echo-install.result }}' = success
  build-echo:
    name: build-echo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-echo
      - name: Provision pinned Android Rust target
        run: |
          channel=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup target add --toolchain "$channel" armv7-linux-androideabi
      - name: build-echo
        run: make build-echo
      - name: Publish Echo bridge
        if: hashFiles('crates/echo-bridge/Cargo.toml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: echo-bridge-armv7-android-${{ github.sha }}
          path: target/armv7-linux-androideabi/release/echo-bridge
          if-no-files-found: error
