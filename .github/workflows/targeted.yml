name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 387662573ea76e69de2da63543ad448e202d2a19
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - name: Verify implementation checkout
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 387662573ea76e69de2da63543ad448e202d2a19
      - name: xtask unit and CLI tests
        run: cargo test -p xtask
      - name: Seeded R5 diagnostic
        run: cargo test -p xtask sb_subsystem_rejects_other_subsystem -- --show-output
      - name: Real workspace lint-deps
        run: make lint-deps
      - name: TARGETED_RESULT
        if: success()
        run: echo 'TARGETED_RESULT repeat=1 exit=0'
