name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Run the seeded template layout regression
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  layout-seed:
    if: inputs.release_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Run the normal screen suite with the seeded overlap
        working-directory: web/screen
        run: |
          npm ci --offline=false
          npm ci --offline
          npx --offline playwright install --with-deps chromium
          set +e
          npm test
          code=$?
          echo "TARGETED_RESULT repeat=1 exit=$code"
          exit "$code"
