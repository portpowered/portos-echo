name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Run the isolated release-kit witnesses
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  screen-pack-push-witness:
    if: inputs.release_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.0
          fallback: none
      - name: Provision media tools for the existing template fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify fake transport and release kit on Linux
        shell: sh
        run: |
          set +e
          (
            set -eu
            shellcheck scripts/make-template-screenpack.sh scripts/echo-screen-pack.sh
            shfmt -d scripts/make-template-screenpack.sh scripts/echo-screen-pack.sh
            python3 tests/test_release_kit.py
          )
          code=$?
          echo "TARGETED_RESULT repeat=1 exit=$code"
          exit "$code"
