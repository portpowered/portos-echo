name: Targeted allocation change lint
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - name: Shape, package boundaries and unchanged CI parity
        run: |
          make lint-deps lint-ci-parity lint-shape
          cargo test --locked -p xtask ci_parity
      - name: Strict Rust lint on the affected crates
        if: always()
        run: |
          cargo clippy --locked --keep-going -p echo-audio -p echo-bridge -p echo-link -p echo-wyoming -p echo-media -p echo-screen-server -p echo-sub-pacer -p echo-sub-session -p xtask --all-targets -- -D warnings

  alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
      - name: Confirm the final allocation gate
        run: |
          git rev-parse HEAD^
          make test-alloc
          printf 'TARGETED_RESULT P-ALLOC exit=0\n'
