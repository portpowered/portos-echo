name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e13e7661d01cc48bf79a4135741051d3a9776ac
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - run: git rev-parse HEAD
      - run: cargo fmt --all --check
      - run: cargo xtask lint-shape
      - run: cargo xtask lint-rules
      - run: cargo clippy --locked -p echo-bridge --lib --test bridge_t3 -- -D warnings
