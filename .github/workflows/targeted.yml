name: Targeted
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: targeted-reports-45086408167-1
          path: ${{ runner.temp }}/a1-baseline
          run-id: 45086408167
          github-token: ${{ github.token }}
      - name: Paused public M2 run with a lone row
        shell: bash
        run: |
          make sim-prereqs
          out="$(mktemp -d)/m2"
          ECHO_LAB_TRACE_TICK=1 target/debug/echo-lab run tests/scenarios/m2-live-connect.yaml --driver sim --out "$out"
          python - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path
          out = Path(sys.argv[1])
          report = json.loads((out / "report.json").read_text())
          case = json.loads((out / "m2-success.json").read_text())
          rows = [row for row in case["trace"] if row["event"] == "clock.offset"]
          assert report["result"] == "pass" and all(report["checks"].values())
          assert len(rows) == 1 and case["calls"] == 1 and case["provider_wire"] is True
          assert case["reply_pcm"]["pcm_bytes"] == 9600
          print("A1_TICK virtual_ms=100 rows=1 provider_calls=1 reply_pcm_bytes=9600")
          print(json.dumps(rows[0], sort_keys=True, separators=(",", ":")))
          PY
      - name: Compare the correction writer with the original M2 byte golden
        env:
          A1_GOLDEN: ${{ runner.temp }}/a1-baseline/repeat-1
        shell: bash
        run: |
          git fetch origin scratch/sb-a1-trace-golden-candidate
          file=crates/echo-bridge/src/bridge_trace.rs
          trap 'git restore -- "$file"' EXIT
          git show FETCH_HEAD:"$file" | sed -n '/^async fn bridge_trace_m2_golden_witness()/,$p' | sed '/^}/q' > "$RUNNER_TEMP/golden-test.rs"
          test -s "$RUNNER_TEMP/golden-test.rs"
          printf '\n#[cfg(test)]\n#[tokio::test(start_paused = true)]\n' >> "$file"
          cat "$RUNNER_TEMP/golden-test.rs" >> "$file"
          cargo test --locked -p echo-bridge --lib bridge_trace_m2_golden_witness
          cmp "$A1_GOLDEN/0-m2-live-connect/trace-golden.jsonl" "$A1_GOLDEN/candidate.jsonl"
          wc -cl "$A1_GOLDEN/candidate.jsonl"
          sha256sum "$A1_GOLDEN/candidate.jsonl"
          echo 'TRACE_GOLDEN_CMP candidate_exit=0'
      - name: Seed the released screen port race
        shell: bash
        run: |
          file=crates/echo-bridge/tests/codex_operator/voice_entry.rs
          trap 'git restore -- "$file"' EXIT
          python - "$file" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text()
          choose = '.replace(&fixture.screen.to_string(), "127.0.0.1:0")'
          assert source.count(choose) == 1
          path.write_text(source.replace(choose, '.replace(&fixture.screen.to_string(), &listener.local_addr().unwrap().to_string())'))
          PY
          set +e
          cargo nextest run --locked -p echo-bridge --test bridge_t3 --run-ignored only --config-file .github/nextest.toml --profile ci -E 'test(codex_voice_entry_binary_missing_configuration_never_dials_wyoming)' > "$RUNNER_TEMP/seeded-screen.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/seeded-screen.log"
          test "$status" -ne 0
          grep -F 'failed: echo-bridge: screen' "$RUNNER_TEMP/seeded-screen.log"
          grep -F 'left: Some(1)' "$RUNNER_TEMP/seeded-screen.log"
          grep -F 'right: Some(2)' "$RUNNER_TEMP/seeded-screen.log"
          echo "A1_SCREEN_OCCUPIED expected_code=2 actual_code=1"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Verify dependencies and locked composition
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/world-metadata.json"
          make lint-deps
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Repository lint
        run: make lint
