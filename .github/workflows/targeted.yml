name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Optional nextest -E expression
        type: string
        required: false
        default: ''
      scenarios:
        description: Optional space-separated scenario stems or .yaml filenames
        type: string
        required: false
        default: ''
      repeat:
        description: Number of executions, integer 1-10
        type: number
        required: false
        default: 1
      ignored:
        description: Include ignored tests in the filter selection
        type: boolean
        required: false
        default: true
      release_bundle:
        description: Build and verify the distributable release bundle
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  allocation-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: Verify the counter catches a transient allocation
        shell: sh
        run: |
          set -eu
          file=crates/echo-sub-call/src/uplink/tests.rs
          saved=$(mktemp)
          cp "$file" "$saved"
          trap 'cp "$saved" "$file"; rm -f "$saved"' EXIT
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/echo-sub-call/src/uplink/tests.rs")
          content = path.read_text()
          needle = "fn fill_overflow_and_drain(state: &mut State, run: SessionHandle) {\n"
          assert content.count(needle) == 1
          seed = "    drop(std::hint::black_box(Box::new(std::hint::black_box(1_u64))));\n"
          path.write_text(content.replace(needle, needle + seed))
          PY
          test_name=uplink::tests::fixed_ring_evicts_oldest_and_drains_in_order_in_the_original_storage
          output=$(mktemp)
          code=0
          cargo test -p echo-sub-call --locked "$test_name" -- --exact --nocapture >"$output" 2>&1 || code=$?
          cat "$output"
          test "$code" -eq 101
          grep -F 'uplink allocated after construction' "$output"
          grep -F 'left: 1' "$output"
          grep -F 'right: 0' "$output"
          cp "$saved" "$file"
          git diff --exit-code -- "$file"
          cargo test -p echo-sub-call --locked "$test_name" -- --exact --nocapture
          echo 'TARGETED_RESULT repeat=1 exit=0'
