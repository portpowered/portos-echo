name: Targeted A2 audio witnesses
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
      - name: Clean and seeded allocation gate
        shell: bash
        run: |
          set -euxo pipefail
          uname -srmo
          rustc -Vv
          git rev-parse HEAD^
          for shard in unpartitioned count:1/4 count:2/4 count:3/4 count:4/4; do
            partition=$shard
            if [ "$shard" = unpartitioned ]; then partition=; fi
            recipe=$(make -n test-unit-rust NEXTEST_PARTITION="$partition")
            count=$(printf '%s\n' "$recipe" | grep -F -c -- '-p echo-bridge --test world_alloc_t3' || true)
            case "$shard" in
              unpartitioned|count:1/4) test "$count" = 1 ;;
              *) test "$count" = 0 ;;
            esac
            printf 'ALLOC_SCHEDULING shard=%s count=%s\n' "$shard" "$count"
          done
          make test-alloc
          f=crates/echo-sub-pacer/src/lib.rs
          sed -i '/PacerEvent::MicrophoneFrame(frame) => {/a\                std::hint::black_box(vec![1_u8; 4]);' "$f"
          set +e
          make test-alloc 2>&1 | tee "$RUNNER_TEMP/seed.log"
          code=${PIPESTATUS[0]}
          set -e
          git restore -- "$f"
          git diff --exit-code -- "$f"
          test "$code" -ne 0
          grep -E 'ALLOC path=capture .* core=500 ' "$RUNNER_TEMP/seed.log"
          grep -F 'capture core allocations' "$RUNNER_TEMP/seed.log"
          printf 'TARGETED_RESULT P-ALLOC exit=0 P-SEED expected_failure=%s\n' "$code"
      - name: Check allocation witness lint
        run: cargo clippy --locked -p echo-bridge --test world_alloc_t3 -- -D warnings
