name: A1 loopback correction evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the product head
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Provision the lint dependency cache and secret scanner
        run: |
          cargo deny fetch
          directory=$(mktemp -d)
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$directory/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $directory/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          sudo install "$directory/gitleaks" /usr/local/bin/gitleaks
          npm --prefix web/screen ci --offline=false
      - name: Run exact ShellCheck and make lint
        shell: sh
        run: |
          shellcheck scripts/device/a1-override.sh
          echo 'shellcheck scripts/device/a1-override.sh: exit=0'
          make lint
          echo 'make lint: exit=0'
  exact-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the product head
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
      - uses: ./.github/actions/setup
        with:
          target: test-sim
      - name: Enable isolated Linux network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Print the complete copied satellite matrix and check existing device CLI
        shell: sh
        run: |
          cargo nextest run --locked -p echo-bridge --test bridge_t3 --run-ignored only --config-file .github/nextest.toml --profile ci --success-output immediate -E 'test(t3_hassmic_name_supervisor_cli)'
          cargo nextest run --locked -p echo-bridge --test device_cli --config-file .github/nextest.toml --profile ci
  seed-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the product head
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
      - uses: ./.github/actions/setup
        with:
          target: test-sim
      - name: Enable isolated Linux network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Remove only the exact hassmic alias and capture the startup failure
        shell: sh
        run: |
          sed -i 's/\["hassmic-host", "hassmic"\]/["hassmic-host"]/' crates/echo-device/src/lib.rs
          git diff --exit-code -- crates/echo-device/src/lib.rs && exit 1
          git diff -- crates/echo-device/src/lib.rs
          log=$(mktemp)
          result=0
          cargo nextest run --locked -p echo-bridge --test bridge_t3 --run-ignored only --config-file .github/nextest.toml --profile ci -E 'test(t3_hassmic_name_supervisor_cli)' > "$log" 2>&1 || result=$?
          cat "$log"
          printf 'TARGETED_RESULT repeat=1 exit=%s\n' "$result"
          test "$result" -eq 100
          grep -F 'T3-01 private network namespace interfaces=["lo"]' "$log"
          grep -F 'T3-01 hassmic Wyoming readiness or info failed' "$log" | grep -F 'echo-bridge: invalid input'
