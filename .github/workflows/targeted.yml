name: Independent A2 allocation review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 83c7f76cc39d28b4fa0d768dc55448b40a30c04b
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
      - name: Run the delivered gate with scratch state
        shell: sh
        run: |
          set -eu
          scratch="$(mktemp -d "$RUNNER_TEMP/a2-review.XXXXXX")"
          mkdir "$scratch/home"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$scratch/home" USERPROFILE="$scratch/home" XDG_CACHE_HOME="$scratch/home/.cache"
          export XDG_CONFIG_HOME="$scratch/home/.config" XDG_DATA_HOME="$scratch/home/.local/share"
          git rev-parse HEAD
          rustc --version
          set +e
          make test-alloc > "$scratch/alloc.log" 2>&1
          result=$?
          if grep -q 'Runtime log:' "$scratch/alloc.log"; then
            printf 'Unexpected runtime log output; ending proof\n'
            exit 1
          fi
          cat "$scratch/alloc.log"
          printf 'REVIEW_RESULT make test-alloc exit=%s\n' "$result"
          exit "$result"
