name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Exercise the delivered Linux installer against bundled-shell fixtures
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  delivery:
    if: inputs.release_bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the prebuilt Linux installer
        env:
          ECHO_SETUP_RELEASE_VERSION: '0.1.0'
        run: cargo build --locked -p echo-setup --bin echo-setup
      - name: Run artifact journey with synthetic Android payload
        run: |
          python3 - <<'PY'
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_release_kit import ReleaseBox
          with ReleaseBox() as box:
              shutil.copyfile('target/debug/echo-setup', box.installer)
              windows = box.assets / 'echo-setup-0.1.0-windows-x86_64.exe'
              windows.write_bytes(b'MZ' + bytes(58) + b'\x40\x00\x00\x00PE\x00\x00\x64\x86')
              box.rehash()
              shutil.copytree(box.assets, 'dist')
          PY
          python3 tests/test_release_kit.py --assets dist

