name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8040780c6c58c10e9c3e093e7f6e0592ee6dab90
          persist-credentials: false
      - name: Check Linux screen wire and web model
        run: |
          git rev-parse HEAD
          cargo test --locked -p echo-screen-contract --test screen_wire --test screen_schema
          cd web/screen
          npm ci --offline=false
          npm run lint
          npm run build
          node --test tests/wire.test.mjs
