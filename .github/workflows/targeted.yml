name: Targeted A2 allocation correction
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 50e0c80d76559d5cef8e5fb5395ea696dfa01d00
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Verify loopback lint and Rust formatting
        run: |
          git rev-parse HEAD
          make lint-rules
          rustfmt --check --edition 2024 crates/echo-bridge/tests/world_alloc_t3/screen.rs
          printf 'TARGETED_RESULT P-LINT exit=0\n'
  alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 50e0c80d76559d5cef8e5fb5395ea696dfa01d00
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
      - name: Verify the allocation gate with the real SSE fixture
        run: |
          git rev-parse HEAD
          rustc --version
          make test-alloc
          printf 'TARGETED_RESULT P-ALLOC exit=0\n'
