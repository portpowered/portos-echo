name: Exact A1 Unix socket witnesses
on:
  workflow_dispatch:
    inputs:
      code_sha:
        description: Exact implementation commit to verify
        required: true
        type: string
      selection:
        description: Witness selection (all or a job name)
        default: all
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: sh
jobs:
  socket:
    if: ${{ inputs.selection == 'all' || inputs.selection == 'socket' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Compile prebuilt bridge and run policy and socket witnesses
        run: |
          git rev-parse HEAD
          cargo test --locked -p echo-device -p echo-wyoming -p echo-bridge --lib socket_policy_ -- --nocapture
          cargo test --locked -p echo-wyoming --lib refused_attempts_follow_capped_backoff_and_timeout
          cargo test --locked -p echo-wyoming --lib eof_partial_and_malformed_generations_reconnect_without_replay
          cargo build --locked -p echo-bridge --bin echo-bridge
          cargo nextest run -p echo-bridge --test bridge_t3 --run-ignored only --locked --config-file .github/nextest.toml --profile ci --success-output immediate -E 'test(t3_a1_socket_)'
  scenarios:
    if: ${{ inputs.selection == 'all' || inputs.selection == 'scenarios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Run unsharded scenarios
        run: |
          git rev-parse HEAD
          unset SCENARIO_PARTITION SCENARIO_SHARD
          make test-sim-scenarios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a1-all-sim-reports
          path: /tmp/echo-lab*/**/report.json
          if-no-files-found: warn
  host:
    if: ${{ inputs.selection == 'all' || inputs.selection == 'host' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: TCP components and pinned fork compatibility
        run: |
          git rev-parse HEAD
          make test-sim-components
          HASSMIC_HOST_FROM_FORK=1 make sim-prereqs
          HASSMIC_HOST_FROM_FORK=1 target/debug/echo-lab run tests/scenarios/w1-wake-stream.yaml --driver sim --out "$RUNNER_TEMP/fork-w1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a1-pinned-fork-report
          path: ${{ runner.temp }}/fork-w1/report.json
          if-no-files-found: warn
  android:
    if: ${{ inputs.selection == 'all' || inputs.selection == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-echo
      - name: Cross-build and check the generated Android entry
        run: |
          git rev-parse HEAD
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.3.13750724'
          fi
          rustup target add --toolchain 1.100.0 armv7-linux-androideabi
          make build-echo
          target=target/armv7-linux-androideabi/release
          tools=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          entry=$(find "$target/build" -name hassmic_main.c -exec grep -lF 'int unix_listener = echo_hassmic_prepare_listener();' {} + | head -n 1)
          test -n "$entry"
          printf 'Generated entry %s\n' "$entry"
          "$tools/armv7a-linux-androideabi24-clang" -E -Ithird_party/hassmic/src/include -Ithird_party/hassmic/src/hassmic -DVERSION='"check"' -DBUILD='"check"' "$entry" > "$RUNNER_TEMP/hassmic.i"
          grep -F 'int unix_listener = echo_hassmic_prepare_listener();' "$RUNNER_TEMP/hassmic.i"
          grep -F 'int ls = unix_listener;' "$RUNNER_TEMP/hassmic.i"
          grep -F "case 'p': port = atoi(optarg); break;" "$RUNNER_TEMP/hassmic.i"
          ! grep -F 'net_listen(core_port)' "$RUNNER_TEMP/hassmic.i"
          "$tools/llvm-strings" "$target/echo-bridge" | grep -oF '/data/misc/portos-echo-device/wyoming.sock' | sort -u
          printf '%s\n' 'armv7-linux-androideabi: Android generated entry has no TCP Wyoming bind, including with legacy -p 16700'
  lint:
    if: ${{ inputs.selection == 'all' || inputs.selection == 'lint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Run the repository lint gate
        run: |
          git rev-parse HEAD
          make lint
