name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Optional nextest -E expression
        type: string
        required: false
        default: ''
      scenarios:
        description: Optional space-separated scenario stems or .yaml filenames
        type: string
        required: false
        default: ''
      repeat:
        description: Number of executions, integer 1-10
        type: number
        required: false
        default: 1
      ignored:
        description: Include ignored tests in the filter selection
        type: boolean
        required: false
        default: true
      release_bundle:
        description: Build and verify the distributable release bundle
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test-unit-screen:
    name: test-unit-screen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 917d9e4dac8c7cb5b134c4cabf8ffa7ccfd5cb71
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-screen
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Provision pinned screen Chromium
        run: cd web/screen && npx --offline playwright install --with-deps chromium
      - name: Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test-unit-screen
        run: make test-unit-screen
      - name: Publish screen screenshot evidence
        if: always()
        id: screen-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screen-evidence-917d9e4dac8c7cb5b134c4cabf8ffa7ccfd5cb71
          path: |
            web/screen/test-results/screenshots/**
            web/screen/test-results/summary.txt
          if-no-files-found: error
  rust:
    name: E5 Rust packages and screen schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 917d9e4dac8c7cb5b134c4cabf8ffa7ccfd5cb71
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-rust
          sim: 'true'
      - name: Regenerate and verify schemas
        shell: sh
        run: |
          git rev-parse HEAD
          UPDATE_SCHEMAS=1 cargo test --locked -p echo-screen-contract --test screen_schema
          npm --prefix web/screen ci --offline=false
          npm --prefix web/screen run generate:schema
          git diff --exit-code -- schemas/screen web/screen/src/model.ts web/screen/src/settings
          cargo test --locked -p echo-screen-contract --test screen_wire --test screen_schema
          npm --prefix web/screen run check:schema
      - name: PRD Rust package checks
        run: cargo nextest run --locked -p echo-bridge -p echo-signin --all-targets --config-file .github/nextest.toml --profile ci
  lint:
    name: E5 make lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 917d9e4dac8c7cb5b134c4cabf8ffa7ccfd5cb71
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Secret scanner
        shell: sh
        run: |
          directory=$(mktemp -d)
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$directory/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $directory/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          sudo install "$directory/gitleaks" /usr/local/bin/gitleaks
      - name: Provision lint caches
        run: |
          cargo deny fetch
          npm --prefix web/screen ci --offline=false
      - name: Run the PRD lint target
        run: make lint
