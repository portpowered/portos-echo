name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Optional nextest -E expression
        type: string
        required: false
        default: ''
      scenarios:
        description: Optional space-separated scenario stems or .yaml filenames
        type: string
        required: false
        default: ''
      repeat:
        description: Number of executions, integer 1-10
        type: number
        required: false
        default: 1
      ignored:
        description: Include ignored tests in the filter selection
        type: boolean
        required: false
        default: true
      release_bundle:
        description: Build and verify the distributable release bundle
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  targeted:
    name: E5 M2 simulated scenario
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c1a98ed16dbbc38304ba1c41356aae247f46ebb8
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run unchanged M2 scenario
        shell: sh
        run: |
          git rev-parse HEAD
          make sim-prereqs
          mkdir -p "$RUNNER_TEMP/targeted-reports"
          status=0
          cargo run --locked -p echo-lab -- run tests/scenarios/m2-live-connect.yaml --driver sim --out "$RUNNER_TEMP/targeted-reports/m2-live-connect" || status=$?
          printf 'TARGETED_RESULT repeat=1 exit=%s\n' "$status"
          exit "$status"
      - name: Publish scenario report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: targeted-reports-m2-live-connect
          path: ${{ runner.temp }}/targeted-reports
          if-no-files-found: ignore
          retention-days: 3
