name: Targeted lane evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lane-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: Run declared lints on the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          npm --prefix web/screen ci --offline=false
          make lint
          printf 'make lint exit=0\n'
          make lint-deps
          printf 'make lint-deps exit=0\n'
  lane-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run declared component suites on the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          set -x
          cargo test --locked -p echo-bridge --lib barge_turn_ -- --nocapture
          cargo test --locked -p echo-bridge --lib barge -- --nocapture
          cargo test --locked -p echo-bridge --lib no_answer_ -- --nocapture
          cargo test --locked -p echo-bridge --lib session_world -- --nocapture
          cargo test --locked -p echo-sub-session --lib -- --nocapture
  lane-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Run the whole sim suite on the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          make test-sim-scenarios 2>&1 | tee "$RUNNER_TEMP/session-suite.log"
          git grep -l '^tiers:.*T3' HEAD^ -- tests/scenarios | sed 's/.*\///;s/\.yaml$//' | sort > "$RUNNER_TEMP/session-expected"
          sed -n 's/^world invariant scenario=\(.*\) status=pass$/\1/p' "$RUNNER_TEMP/session-suite.log" | sort > "$RUNNER_TEMP/session-observed"
          diff -u "$RUNNER_TEMP/session-expected" "$RUNNER_TEMP/session-observed"
          count=$(wc -l < "$RUNNER_TEMP/session-observed" | tr -d ' ')
          grep -Fx "executed=$count passed=$count failed=0 not_runnable=0" "$RUNNER_TEMP/session-suite.log"
  lane-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Corrupt the released idle deadline and restore the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          python - <<'PY'
          from pathlib import Path
          target = Path("crates/echo-sub-session/src/lib.rs")
          source = target.read_text()
          clean = "state.run = None;\n                state.idle_deadline = None;"
          corrupt = "state.idle_deadline = state.run.take().map(|run| run.response_due);"
          assert source.count(clean) == 1
          target.write_text(source.replace(clean, corrupt))
          PY
          make sim-prereqs
          witness_root=$(mktemp -d "$RUNNER_TEMP/sb-session-seed.XXXXXX")
          printf 'witness_root=%s\n' "$witness_root" >> "$GITHUB_ENV"
          seed_status=0
          ECHO_LAB_WORLD_SEED=101 target/debug/echo-lab run tests/scenarios/session-idle-timeout.yaml --driver sim --out "$witness_root/failure" > "$witness_root/failure.log" 2>&1 || seed_status=$?
          cat "$witness_root/failure.log"
          printf 'seed=101 corrupted exit=%s\n' "$seed_status"
          test "$seed_status" -ne 0
          grep -Fx 'world invariant scenario=session-idle-timeout status=fail' "$witness_root/failure.log"
          test "$(grep -c '^World diff:' "$witness_root/failure.log")" -eq 1
          grep -Fx 'World diff: session.idle_deadline: expected absent without active run, actual present' "$witness_root/failure.log"
          git restore -- crates/echo-sub-session/src/lib.rs
          make sim-prereqs
          ECHO_LAB_WORLD_SEED=101 target/debug/echo-lab run tests/scenarios/session-idle-timeout.yaml --driver sim --out "$witness_root/restored" 2>&1 | tee "$witness_root/restored.log"
          grep -Fx 'world invariant scenario=session-idle-timeout status=pass' "$witness_root/restored.log"
          grep -Fx 'World diff: none (invariants hold)' "$witness_root/restored.log"
          printf 'seed=101 restored exit=0\n'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.witness_root != ''
        with:
          name: targeted-reports-session-seed
          path: ${{ env.witness_root }}/**
          retention-days: 3
