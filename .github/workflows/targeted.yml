name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m2-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 61ba20b11d2387c3a7dc74a37c553400ecfde25c
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Exercise the exact reviewed head
        id: proof
        shell: bash
        run: |
          set -eu
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 61ba20b11d2387c3a7dc74a37c553400ecfde25c
          proof_root="$(mktemp -d "$RUNNER_TEMP/a2-call-review.XXXXXX")"
          mkdir -p "$proof_root/home" "$proof_root/tmp"
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$proof_root/home" USERPROFILE="$proof_root/home" TMPDIR="$proof_root/tmp"
          export CODEX_HOME="$proof_root/home/.codex"
          mkdir -p "$CODEX_HOME"
          printf 'Review scratch: %s\n' "$proof_root"
          set +e
          make sim-prereqs
          build_code=$?
          set -e
          printf 'make sim-prereqs exit=%s\n' "$build_code"
          test "$build_code" -eq 0
          report_parent="$(mktemp -d)"
          printf 'report_root=%s\n' "$report_parent/m2" >> "$GITHUB_OUTPUT"
          set +e
          ECHO_LAB_WORLD_SEED=101 target/debug/echo-lab run tests/scenarios/m2-live-connect.yaml --driver sim --out "$report_parent/m2"
          scenario_code=$?
          set -e
          printf 'seed-101 M2 exit=%s\n' "$scenario_code"
          exit "$scenario_code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.proof.outputs.report_root != ''
        with:
          name: m2-review-report
          path: ${{ steps.proof.outputs.report_root }}
          retention-days: 3
