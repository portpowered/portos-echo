name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e13e7661d01cc48bf79a4135741051d3a9776ac
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Paired Relink acceptance
        run: |
          git rev-parse HEAD
          make sim-prereqs
          cargo nextest run --locked -p echo-bridge --test bridge_t3 --run-ignored only             --config-file .github/nextest.toml --profile ci --success-output immediate --no-fail-fast             -E 'test(t3_bridge_screen_signin) | test(t3_settings_account_changes_reuse_the_credential_owners)'
