name: Targeted lane evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lane-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Run the whole sim suite on the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          make test-sim-scenarios 2>&1 | tee "$RUNNER_TEMP/session-suite.log"
          git grep -l '^tiers:.*T3' HEAD^ -- tests/scenarios | sed 's/.*\///;s/\.yaml$//' | sort > "$RUNNER_TEMP/session-expected"
          sed -n 's/^world invariant scenario=\(.*\) status=pass$/\1/p' "$RUNNER_TEMP/session-suite.log" | sort > "$RUNNER_TEMP/session-observed"
          diff -u "$RUNNER_TEMP/session-expected" "$RUNNER_TEMP/session-observed"
          count=$(wc -l < "$RUNNER_TEMP/session-observed" | tr -d ' ')
          grep -Fx "executed=$count passed=$count failed=0 not_runnable=0" "$RUNNER_TEMP/session-suite.log"
