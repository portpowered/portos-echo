name: Targeted
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional lane commit to verify
        type: string
        required: false
jobs:
  schemas:
    if: ${{ inputs.source_ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-contracts
      - run: UPDATE_SCHEMAS=1 cargo test --offline --locked -p echo-screen-contract --test screen_schema settings_v2_schema_snapshots
      - run: cargo test --offline --locked -p echo-screen-contract --test screen_schema settings_v2_schema_snapshots
      - run: npm --prefix web/screen ci --ignore-scripts
      - run: npm --prefix web/screen run generate:schema
      - run: npm --prefix web/screen run check:schema
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-mode-schemas
          path: |
            schemas/screen/settings_patch_v2.json
            schemas/screen/settings_snapshot_v2.json
            web/screen/src/settings/model.ts
