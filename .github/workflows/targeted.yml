name: Targeted
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Unsharded scenario suite
        shell: bash
        run: |
          set -o pipefail
          make test-sim-scenarios | tee "$RUNNER_TEMP/a1-scenarios.log"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          expected = []
          for path in Path("tests/scenarios").glob("*.yaml"):
              header = path.read_text().splitlines()
              if any(line.startswith("tiers:") and "T3" in line for line in header):
                  expected.append(next(line.split()[1] for line in header if line.startswith("id:")))
          log = (Path(os.environ["RUNNER_TEMP"]) / "a1-scenarios.log").read_text()
          ids = re.findall(r"^world invariant scenario=(\S+) status=pass$", log, re.M)
          assert sorted(ids) == sorted(expected), (ids, expected)
          assert f"executed={len(ids)} passed={len(ids)} failed=0 not_runnable=0" in log
          print(f"A1_SCENARIOS checked={len(ids)} distinct={len(set(ids))}")
          print("TARGETED_RESULT repeat=1 exit=0")
          PY
      - name: Same-seed M2 snapshots
        shell: bash
        run: |
          export ECHO_LAB_WORLD_SEED=101
          root=$(mktemp -d)
          for case in first second; do
            target/debug/echo-lab run tests/scenarios/m2-live-connect.yaml --driver sim --out "$root/$case"
            python -c 'import json, sys; p = json.load(open(sys.argv[1])); assert len(p) == 3 and all(r["status"] == "pass" and r["diff"] is None for r in p); print("verified 3 private world snapshots")' "$root/$case/world-snapshots.private.json"
            stat -c 'mode=%a' "$root/$case/world-snapshots.private.json"
          done
          cmp "$root/first/world-snapshots.private.json" "$root/second/world-snapshots.private.json"
          sha256sum "$root/first/world-snapshots.private.json" "$root/second/world-snapshots.private.json"
          printf '%s\n' 'A1_SNAPSHOTS cmp_exit=0'
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Bridge and component regressions
        run: make test-sim-bridge test-sim-components
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Seed one impossible capture field
        shell: bash
        run: |
          make sim-prereqs
          python - <<'PY'
          from pathlib import Path
          p = Path("crates/echo-core-api/src/device.rs")
          source = p.read_text()
          needle = "DeviceEvent::Disconnected => self.view = DeviceView::default(),"
          assert source.count(needle) == 1
          p.write_text(source.replace(needle, "DeviceEvent::Disconnected => self.view = DeviceView { capture_open: true, ..DeviceView::default() },"))
          PY
          trap 'git restore -- crates/echo-core-api/src/device.rs' EXIT
          cargo build --locked -p echo-bridge --bin echo-bridge
          root=$(mktemp -d)
          set +e
          target/debug/echo-lab run tests/scenarios/m2-live-connect.yaml --driver sim --out "$root/a1-seed" > "$root/stdout" 2> "$root/stderr"
          status=$?
          set -e
          cat "$root/stdout" "$root/stderr"
          test "$status" -eq 1
          test "$(grep -c '^World diff:' "$root/stdout")" -eq 1
          grep -Fxq 'World diff: device.capture_open: expected false, actual true' "$root/stdout"
          python - "$root/a1-seed" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          report = json.loads((root / "report.json").read_text())
          assert report["result"] == "fail" and all(report["checks"].values()), report["checks"]
          m2 = json.loads((root / "m2-success.json").read_text())
          assert m2["provider_wire"] is True and m2["calls"] == 1
          print("A1_SEED exit=1 world_diffs=1 provider_wire=true calls=1")
          PY
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Verify dependencies and locked composition
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/world-metadata.json"
          make lint-deps
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Repository lint
        run: make lint
