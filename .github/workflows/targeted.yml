name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        type: string
      scenarios:
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-host
      - name: Compare Help and Exercise the Vendored TCP Role
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopus-dev zlib1g-dev
          cargo build --locked -p echo-bridge
          HASSMIC_HOST_FROM_FORK=1 sh scripts/hassmic-host.sh build
          export FORK_BINARY
          FORK_BINARY=$(HASSMIC_HOST_FROM_FORK=1 sh scripts/hassmic-host.sh path)
          cargo test --locked -p echo-bridge --test device_cli
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          from subprocess import run
          import sys
          from tempfile import TemporaryDirectory
          bridge = Path("target/debug/echo-bridge").resolve()
          fork = Path(os.environ["FORK_BINARY"])
          for exe, args in ((fork, ["hassmic", "--help"]), (bridge, [str(bridge), "device", "--help"])):
              result = run(args, executable=exe, capture_output=True, text=True)
              print(f"{exe.name}: status={result.returncode} stdout={result.stdout!r}\n{result.stderr}")
              assert result.returncode == 2 and not result.stdout
              if exe == fork:
                  expected = result.stderr
              else:
                  assert result.stderr == expected
          notices = run([bridge, "notices"], capture_output=True, text=True, check=True).stdout
          for label in ["hassmic", "Port OS hassmic shims", "minimp3 (CC0-1.0)", "monocypher.c", "monocypher.h", "RNNoise"]:
              assert f"{label}\n" in notices
              print(f"notices: {label}")
          sys.path.insert(0, str(Path("tests").resolve()))
          from wyoming_host import describe
          capture = runpy.run_path("scripts/capture-wyoming.py")
          Session = capture["Session"]
          original = Session.__enter__.__globals__["subprocess"].Popen
          def launch(args, **kwargs):
              return original([str(bridge), "device", *args[1:]], **kwargs)
          from unittest.mock import patch
          class Device(Session):
              def stage(self):
                  return bridge
          with TemporaryDirectory() as folder, patch.object(capture["subprocess"], "Popen", side_effect=launch):
              with Device(folder) as session:
                  info = describe(session.sock)
                  assert info["satellite"]["name"] == "Capture Echo", info
                  print("info satellite=Capture Echo")
                  session.wake()
                  assert [row["header"]["type"] for row in session.rows][-2:] == ["run-pipeline", "audio-chunk"]
                  audio = session.rows[-1]["header"]
                  pcm = {name: audio["data"][name] for name in ("rate", "width", "channels")}
                  assert pcm == {"rate": 16000, "width": 2, "channels": 1}
                  print(f"run-pipeline -> audio-chunk: {pcm}, {audio['payload_length']} bytes")
              assert session.proc.poll() is not None
          PY
          echo 'TARGETED_RESULT P-CLI exit=0'
          cargo clippy --locked -p echo-device-sys -p echo-device -p echo-bridge -p xtask --all-targets -- -D warnings
  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: shfmt@3.14.0,shellcheck@0.11.0,cargo-deny@0.20.2
          fallback: none
      - name: Reproduce the Vendor Closure and Seed the Licence Gate
        run: |
          pin=$(sed -n 's/^commit=//p' hassmic.pin)
          fork=$(mktemp -d)
          git init -q "$fork"
          git -C "$fork" fetch -q --depth 1 https://github.com/portpowered/echo-dot-assist "$pin"
          git -C "$fork" checkout -q --detach FETCH_HEAD
          HASSMIC_SRC="$fork" sh third_party/hassmic/sync.sh "$pin"
          git diff --exit-code -- third_party/hassmic
          test -z "$(git ls-files --others --exclude-standard -- third_party/hassmic)"
          shellcheck --severity=style -- third_party/hassmic/sync.sh
          shfmt -d -i 2 -ci third_party/hassmic/sync.sh
          cargo fmt --all --check
          cargo metadata --locked --offline --no-deps --format-version 1 >/dev/null
          cargo deny fetch
          cargo deny --offline check 2>"$RUNNER_TEMP/deny.log" || { cat "$RUNNER_TEMP/deny.log"; exit 1; }
          tail -n 1 "$RUNNER_TEMP/deny.log"
          make lint-rules
          make lint-shape
          seed=third_party/a1a-licence-witness.c
          verify_rejected() {
            status=0
            make lint-rules >"$RUNNER_TEMP/licence.log" 2>&1 || status=$?
            test "$status" -eq 2
            grep -F "$seed: vendor licence: GNU GPL family is prohibited" "$RUNNER_TEMP/licence.log"
          }
          printf '// SPDX-License-Identifier: LGPL-2.1-or-later\n' >"$seed"
          verify_rejected
          printf 'GNU GENERAL PUBLIC LICENSE\nVersion 2, June 1991\n' >"$seed"
          verify_rejected
          rm "$seed"
          make lint-rules
          echo 'TARGETED_RESULT P-LIC exit=0'
  arm:
    strategy:
      fail-fast: false
      matrix:
        source: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select clean baseline
        if: matrix.source == 'baseline'
        run: git checkout --detach dd07ed4d1a3fd5db36e12b8d208c0467d6738787
      - uses: ./.github/actions/setup
        with:
          target: build-echo
      - name: Build and Measure the Release ELF
        env:
          WITNESS_SOURCE: ${{ matrix.source }}
        run: |
          test -f "$ANDROID_NDK_HOME/source.properties" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.3.13750724'
          grep -F '27.3.13750724' "$ANDROID_NDK_HOME/source.properties"
          rustup target add armv7-linux-androideabi
          make build-echo
          tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          binary=target/armv7-linux-androideabi/release/echo-bridge
          git rev-parse HEAD
          if [[ "$WITNESS_SOURCE" == candidate ]]; then
            "$tools/llvm-nm" "$binary" >"$RUNNER_TEMP/nm.txt"
            grep -E '[[:space:]][Tt][[:space:]]+echo_hassmic_main$' "$RUNNER_TEMP/nm.txt"
            "$tools/llvm-readelf" -h -l -d "$binary" >"$RUNNER_TEMP/elf.txt"
            for library in libpryon.so libz.so libOpenSLES.so; do
              grep -F "[$library]" "$RUNNER_TEMP/elf.txt"
            done
            find target/armv7-linux-androideabi/release -name libpryon.so -o -name libz.so
          fi
          cp "$binary" "$RUNNER_TEMP/echo-bridge"
          "$tools/llvm-strip" "$RUNNER_TEMP/echo-bridge"
          file "$RUNNER_TEMP/echo-bridge"
          wc -c "$RUNNER_TEMP/echo-bridge"
          echo "TARGETED_RESULT P-ARM $WITNESS_SOURCE exit=0"

