name: A1 story 001 focused witnesses
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        type: string
        required: false
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Device and core tests
        run: cargo test --locked -p echo-core-api -p echo-sub-device
      - name: Clean and seeded clock boundary
        shell: bash
        run: |
          set -euo pipefail
          set -x
          cargo clippy --locked -p echo-sub-device --all-targets -- -D warnings
          file=crates/echo-sub-device/src/lib.rs
          trap 'git restore -- "$file"' EXIT
          sed -i '/let Event::Device/i\        let _ = std::time::SystemTime::now();' "$file"
          log=$(mktemp)
          set +e
          cargo clippy --locked -p echo-sub-device --all-targets -- -D warnings >"$log" 2>&1
          code=$?
          set -e
          cat "$log"
          test "$code" -ne 0
          grep -F 'use of a disallowed method' "$log"
          grep -F 'std::time::SystemTime::now' "$log"
          echo "Q-CLOCK seeded exit=$code"
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim-suites
          sim: 'true'
      - name: Loopback bridge and component suites
        run: make test-sim-bridge test-sim-components
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: Workspace Rust lint and shape
        run: make lint-rust lint-shape
