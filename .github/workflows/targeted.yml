name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Exercise the native release asset build and bundled shell
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  delivery:
    if: inputs.release_bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision the release host targets
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix
          rustup target add --toolchain 1.100.0 x86_64-unknown-linux-gnu x86_64-pc-windows-gnu
      - name: Cross-build native release installers and assemble the controlled bundle
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_release_kit import PACK
          with tempfile.TemporaryDirectory(prefix='echo-native-release-', dir='/tmp') as temp:
              work = Path(temp)
              env = PACK.build_environment(work)
              installers = PACK.build_installers(work, '0.2.0', env)
              inputs = work / 'android-fixtures'
              inputs.mkdir()
              leaves = ('codex-app-server', 'cacert.pem', 'LICENSE', 'NOTICE', 'echo-bridge', 'screen.apk')
              for name in leaves:
                  (inputs / name).write_text('synthetic Android release input ' + name)
              out = Path('dist')
              out.mkdir()
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              PACK.assemble(out, '0.2.0', head, 'b' * 40, inputs, inputs / 'echo-bridge', inputs / 'screen.apk',
                            {'licenses/ca/MPL-2.0.txt': b'fixture CA license', 'licenses/ca/NOTICE': b'fixture CA notice'},
                            installers)
          PY
      - name: Consume the prebuilt release assets
        run: python3 tests/test_release_kit.py --assets dist

