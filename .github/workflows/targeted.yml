name: Targeted
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Verify dependencies and locked composition
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/world-metadata.json"
          make lint-deps
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - name: Repository lint
        run: make lint
