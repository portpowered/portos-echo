name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run unchanged integration suites
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          make -k test-sim-bridge test-sim-components test-sim-scenarios "SCENARIO_SHARD=--out $RUNNER_TEMP/a1a-reports"
          echo 'TARGETED_RESULT P-SIM suites exit=0'
      - name: Exercise staged executable identity and lifecycle
        if: success() || failure()
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          python3 tests/test_host_teardown.py
          echo 'TARGETED_RESULT P-SIM teardown exit=0'
      - name: Check Wyoming wire values
        if: success() || failure()
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          PYTHONPATH=tests python3 - <<'PY'
          from pathlib import Path
          import runpy
          import socket
          from tempfile import TemporaryDirectory
          from wyoming_host import Host, describe
          capture = runpy.run_path("scripts/capture-wyoming.py")
          read_event = capture["read_event"]
          encoded = capture["encoded"]

          def send(conn, kind, data=None):
              frame = {"type": kind}
              if data is not None:
                  frame["data"] = data
              conn.sendall(encoded(frame) + b"\n")

          def read(stream, kind):
              event, payload = read_event(stream)
              assert event["type"] == kind and not payload, (event, len(payload))
              return event["data"]

          with TemporaryDirectory() as folder:
              host = Host(folder)
              try:
                  host.start()
                  with socket.create_connection(("127.0.0.1", host.port), timeout=3) as conn:
                      with conn.makefile("rb", buffering=0) as stream:
                          initial = read(stream, "hassmic-speaker")
                          assert set(initial) == {"volume", "muted"}, initial
                          assert type(initial["volume"]) is int and 0 <= initial["volume"] <= 100, initial
                          assert initial["muted"] is False, initial
                          print(f"initial speaker={initial}")
                          for kind, data, muted in [
                              ("hassmic-set-volume", {"volume": 30}, False),
                              ("hassmic-set-volume", {"volume": 30}, False),
                              ("hassmic-set-output-mute", {"muted": True}, True),
                          ]:
                              send(conn, kind, data)
                              send(conn, "ping")
                              report = read(stream, "hassmic-speaker")
                              assert report == {"volume": 30, "muted": muted}, report
                              read(stream, "pong")
                              print(f"{kind} {data} -> {report}, then pong")
                          send(conn, "hassmic-set-volume", {"volume": 101})
                          send(conn, "ping")
                          read(stream, "pong")
                          assert describe(conn)["satellite"]["name"] == "Wyoming Test"
                          send(conn, "hassmic-set-output-mute", {"muted": True})
                          report = read(stream, "hassmic-speaker")
                          assert report == {"volume": 30, "muted": True}, report
                          print(f"malformed volume -> pong, then unchanged speaker={report}")
              finally:
                  host.stop()
          with TemporaryDirectory() as folder:
              with capture["Session"](folder) as session:
                  assert describe(session.sock)["satellite"]["name"] == "Capture Echo"
                  session.wake()
                  assert [row["header"]["type"] for row in session.rows][-2:] == ["run-pipeline", "audio-chunk"]
                  header = session.rows[-1]["header"]
                  fmt = {key: header["data"][key] for key in ("rate", "width", "channels")}
                  assert fmt == {"rate": 16000, "width": 2, "channels": 1} and header["payload_length"] > 0
                  print(f"Capture Echo: run-pipeline -> audio-chunk {fmt}, {header['payload_length']} bytes")
              assert session.proc.poll() is not None
          PY
          echo 'TARGETED_RESULT P-SIM wire exit=0'
      - name: Check CI parity
        if: success() || failure()
        run: |
          make lint-ci-parity
          echo 'TARGETED_RESULT ci-parity exit=0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: targeted-reports-a1a
          path: ${{ runner.temp }}/a1a-reports/**/report.json
          if-no-files-found: warn
          retention-days: 3
  rollback-and-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-host
      - name: Exercise clean default and explicit fork rollback
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopus-dev zlib1g-dev
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          host_script=scripts/hassmic-host.sh
          printf '' > "$RUNNER_TEMP/default-git.log"
          GIT_TRACE="$RUNNER_TEMP/default-git.log" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=protocol.https.allow GIT_CONFIG_VALUE_0=never sh "$host_script" build
          test ! -e .cache/hassmic-src
          if grep -F echo-dot-assist "$RUNNER_TEMP/default-git.log"; then exit 1; fi
          default=$(sh "$host_script" path)
          test "$default" = "$PWD/.cache/hassmic-host/vendored/hassmic-host"
          test "$(HASSMIC_HOST_FROM_FORK='' sh "$host_script" path)" = "$default"
          file "$default"
          cmp "$default" target/debug/echo-bridge
          status=0
          sh "$host_script" run --help > "$RUNNER_TEMP/default.out" 2> "$RUNNER_TEMP/default.err" || status=$?
          test "$status" = 2
          test ! -s "$RUNNER_TEMP/default.out"
          cat "$RUNNER_TEMP/default.err"
          for verb in path run; do
            status=0
            output=$(HASSMIC_HOST_FROM_FORK=1 sh "$host_script" "$verb" 2>&1) || status=$?
            test "$status" = 1
            test "$output" = 'hassmic-host: binary missing; run build first'
            printf 'unbuilt fork %s status=%s %s\n' "$verb" "$status" "$output"
          done
          status=0
          output=$(HASSMIC_HOST_FROM_FORK=yes sh "$host_script" path 2>&1) || status=$?
          test "$status" = 1
          test "$output" = 'hassmic-host: HASSMIC_HOST_FROM_FORK must be empty or 1'
          printf 'invalid mode status=%s %s\n' "$status" "$output"
          pin=$(sed -n 's/^commit=//p' hassmic.pin)
          repo=$(sed -n 's/^repo=//p' hassmic.pin)
          (
            export HASSMIC_SRC="$RUNNER_TEMP/pinned-hassmic"
            export HASSMIC_HOST_FROM_FORK=1
            git init -q "$HASSMIC_SRC"
            git -C "$HASSMIC_SRC" fetch -q --depth 1 "$repo" "$pin"
            git -C "$HASSMIC_SRC" sparse-checkout set src devices tools web keys
            git -C "$HASSMIC_SRC" checkout -q --detach FETCH_HEAD
            sh "$host_script" build
            fork=$(sh "$host_script" path)
            test "$fork" = "$PWD/.cache/hassmic-host/$pin/hassmic-host"
            file "$fork"
            cmp "$fork" "$HASSMIC_SRC/build/hassmic-host"
            status=0
            sh "$host_script" run --help > "$RUNNER_TEMP/fork.out" 2> "$RUNNER_TEMP/fork.err" || status=$?
            test "$status" = 2
            test ! -s "$RUNNER_TEMP/fork.out"
            grep '^usage: hassmic ' "$RUNNER_TEMP/fork.err"
            diff -u <(grep '^usage:' "$RUNNER_TEMP/default.err") <(grep '^usage:' "$RUNNER_TEMP/fork.err")
          )
          test "$(sh "$host_script" path)" = "$default"
          echo 'TARGETED_RESULT P-ROLLBACK exit=0'
      - name: Perturb vendored Info and restore the oracle
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          file=third_party/hassmic/src/hassmic/proto_wyoming.c
          original=$(mktemp)
          cp "$file" "$original"
          trap 'cp "$original" "$file"; rm -f "$original"' EXIT
          sed -i 's/core_name, board.model, active/"Seeded Wrong Name", board.model, active/' "$file"
          grep -F '"Seeded Wrong Name", board.model, active' "$file"
          sh scripts/hassmic-host.sh build
          status=0
          sh tests/hassmic_host_smoke.sh > "$RUNNER_TEMP/seeded-smoke.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/seeded-smoke.log"
          test "$status" = 1
          grep -F 'RuntimeError: unexpected satellite identity' "$RUNNER_TEMP/seeded-smoke.log"
          printf 'seeded smoke: exit=%s, wrong Info identity\n' "$status"
          cp "$original" "$file"
          git diff --exit-code -- "$file"
          sh scripts/hassmic-host.sh build
          sh tests/hassmic_host_smoke.sh
          echo 'TARGETED_RESULT P-RED exit=0'
