name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Observe supported configuration against the verified 0.171.0 asset
        run: |
          pin=$(sh scripts/codex-app-server.sh)
          export WITNESS_PIN="$pin"
          export PYTHONPATH="crates/echo-lab/src/lab_run/sim/session/catalog_measurement:crates/echo-bridge/tests/pinned_media"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/openai/codex/ccf9be8cc458bd6b8336fe84d68d8893f2691a5e/codex-rs/models-manager/models.json -o "$RUNNER_TEMP/models.json"
          python3 - <<'PY'
          from copy import deepcopy
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json
          import os
          from pathlib import Path
          from queue import Queue
          import tempfile
          from threading import Thread

          from replay import app_settings, pin, thread_settings
          from tools_provider import Delegation

          bodies = Queue()

          class Observer(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  if self.path == '/v1/responses':
                      bodies.put(body)
                      self.send_error(400)
                  else:
                      self.send_error(403)

              def log_message(self, *args):
                  pass

          tools = [{'name': 'end_session', 'description': 'End the fixture session.',
                    'inputSchema': {'type': 'object', 'properties': {}, 'additionalProperties': False}}]
          expected = [{'type': 'function', 'name': t['name'], 'description': t['description'],
                       'parameters': t['inputSchema'], 'strict': False} for t in tools]
          model = 'gpt-6.1-sol'
          with ThreadingHTTPServer(('127.0.0.1', 0), Observer) as peer:
              task = Thread(target=peer.serve_forever, daemon=True)
              task.start()
              origin = f'http://127.0.0.1:{peer.server_port}'

              def observe(name, cli=(), file='', override=None, metadata=None, write=False):
                  with tempfile.TemporaryDirectory() as temp:
                      home = Path(temp)
                      (home / 'config.toml').write_text(file)
                      args = app_settings(origin) + list(cli)
                      if metadata is not None:
                          catalog = json.loads((Path(os.environ['RUNNER_TEMP']) / 'models.json').read_text())
                          for entry in catalog['models']:
                              if entry['slug'] == model:
                                  entry.update(metadata)
                          (home / 'models.json').write_text(json.dumps(catalog))
                          args.append(f'model_catalog_json="{home}/models.json"')
                      with pin(Path(os.environ['WITNESS_PIN']), args, home, origin) as rpc:
                          rpc.request('initialize', {'clientInfo': {'name': 'echo-lab', 'version': '0.1.0'},
                                                     'capabilities': {'experimentalApi': True}})
                          rpc.send({'method': 'initialized'})
                          if write:
                              rpc.request('config/value/write', {'keyPath': 'tools.experimental_request_user_input.enabled',
                                                                 'value': True, 'mergeStrategy': 'replace'})
                          params = thread_settings(tools, 'flat', model, home)
                          params['config']['features.view_image'] = False
                          for key, val in (override or {}).items():
                              if val is None:
                                  params['config'].pop(key)
                              else:
                                  params['config'][key] = val
                          thread = rpc.request('thread/start', params)['thread']['id']
                          rpc.request('turn/start', {'threadId': thread, 'input': [{'type':'text', 'text':'Fixture only'}]})
                          body = bodies.get(timeout=8)
                          print(f'VARIANT {name}', flush=True)
                          try:
                              Delegation(tools, False, model=model, web_search='disabled').check_tools(body, expected)
                          except AssertionError as error:
                              print(f'CATALOG_REFUSED {name} {error}', flush=True)
                          else:
                              print(f'CATALOG_MATCH {name}', flush=True)

              input_key = 'tools.experimental_request_user_input.enabled'
              observe('bridge-current')
              observe('home-async', file='[tools.experimental_request_user_input]\nenabled = true\n', override={input_key: None})
              observe('cli-async', cli=[f'{input_key}=true'], override={input_key: None})
              observe('config-write-async', write=True, override={input_key: None})
              observe('thread-async', override={input_key: True, 'features.default_mode_request_user_input': False})
              observe('deprecated-patch-feature', override={'features.apply_patch_freeform': False})
              observe('namespace-exclude', override={'features.code_mode.excluded_tool_namespaces': ['functions']})
              observe('namespace-reroute', override={'features.code_mode.direct_only_tool_namespaces': ['web']})
              observe('feature-code-mode-off', override={'features.code_mode': False, 'features.code_mode_only': False})
              observe('catalog-no-patch', override={input_key: True}, metadata={'apply_patch_tool_type': None})
              observe('catalog-code-mode', override={input_key: True}, metadata={'apply_patch_tool_type': None, 'tool_mode': 'code_mode'})
              observe('catalog-code-mode-fail-closed', override={input_key: True, 'code_mode_host.disable_in_process_fallback': True},
                      metadata={'apply_patch_tool_type': None, 'tool_mode': 'code_mode'})
              peer.shutdown()
          PY
