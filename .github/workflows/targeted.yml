name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4d6c6fb2855563a0bd08f62af8dc5b03b2837a66
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-docs
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.0,cargo-deny@0.20.2
          fallback: none
      - name: Prepare rule lint tools
        shell: sh
        run: |
          npm --prefix web/screen ci --offline=false
          cargo deny fetch
          directory=$(mktemp -d)
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$directory/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $directory/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          sudo install "$directory/gitleaks" /usr/local/bin/gitleaks
      - name: Run the PRD lint gate
        shell: bash
        run: |
          git rev-parse HEAD
          if make lint; then status=0; else status=$?; fi
          echo "Q-LINT: make lint exit=$status"
          exit "$status"
  auth-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4d6c6fb2855563a0bd08f62af8dc5b03b2837a66
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run the PRD filesystem and CLI witnesses
        shell: bash
        run: |
          set -x
          git rev-parse HEAD
          cargo nextest run -p echo-codex --lib --locked --config-file .github/nextest.toml --profile ci --no-tests fail -E 'test(/auth_mode_home/)'
          cargo build --locked -p echo-bridge --bin echo-bridge
          cargo nextest run -p echo-bridge --test bridge_t3 --run-ignored only --locked --config-file .github/nextest.toml --profile ci --no-tests fail --success-output immediate -E 'test(/auth_mode_isolation|codex_host_nominated_api_key_and_account_mode_gate_session_admission|codex_configured_service_(authenticates_both_modes|missing_nominated_key)|codex_operator_api_key_status|codex_voice_entry_binary_(local_routes|authenticates_before_ready)|startup_network_/)'
          echo 'TARGETED_RESULT repeat=1 exit=0'
      - name: Run the PRD package gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD
          run() {
            printf 'Command: %s\n' "$*"
            local status
            if "$@"; then status=0; else status=$?; fi
            printf 'Exit: %s for %s\n' "$status" "$*"
            return "$status"
          }
          run make codex-app-server sim-prereqs
          status=0
          run cargo nextest run -p echo-codex -p echo-bridge --all-targets --locked --config-file .github/nextest.toml --profile ci || status=1
          run make test-sim-bridge test-alloc || status=1
          exit "$status"
