name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        type: string
        required: false
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-contract
      - name: Regenerate the Settings wire schemas
        run: UPDATE_SCHEMAS=1 cargo test --locked -p echo-screen-contract --test screen_schema settings_v2_schema_snapshots -- --exact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muse-generated-schemas
          path: schemas/screen/
          if-no-files-found: error
