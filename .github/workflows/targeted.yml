name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-trace-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: Lint changed Rust packages
        run: cargo clippy --locked --keep-going -p echo-core-api -p echo-sub-device -p echo-sub-trace -p echo-svc-trace -p echo-bridge --all-targets -- -D warnings
