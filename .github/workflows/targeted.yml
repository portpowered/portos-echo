name: Targeted
on: workflow_dispatch
permissions:
  contents: read
jobs:
  arm-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: ARM helper component tests
        run: python3 third_party/codex/test_build.py
      - name: Apply patched release and verify the real lock gate
        shell: sh
        run: |
          set -eu
          export CODEX_ARMV7_SOURCE_ONLY=1
          . ./scripts/build-codex-armv7.sh
          repo="$GITHUB_WORKSPACE"
          work=$(mktemp -d)
          commit=ccf9be8cc458bd6b8336fe84d68d8893f2691a5e
          codex_source
          codex_check_lock
          codex_pagable
          python3 - "$work/source/codex-rs/Cargo.lock" <<'PY'
          import collections, pathlib, subprocess, sys, tomllib
          lock = pathlib.Path(sys.argv[1])
          original = subprocess.check_output(
              ["git", "-C", str(lock.parent.parent), "show", "HEAD:codex-rs/Cargo.lock"], text=True)
          before = tomllib.loads(original)["package"]
          after = tomllib.loads(lock.read_text())["package"]
          for previous, updated in zip(before, after, strict=True):
              assert updated == (previous if "source" in previous else dict(previous, version="0.171.0"))
          print("local lock", dict(collections.Counter(p["version"] for p in after if "source" not in p)))
          print("external entries preserved:", sum("source" in p for p in after))
          replacement = lock.read_text()
          for version in ("0.0.0", "0.160.0"):
              changed = replacement.replace('name = "codex-app-server"\nversion = "0.171.0"',
                                            f'name = "codex-app-server"\nversion = "{version}"', 1)
              assert changed != replacement
              lock.with_name(f"Cargo.lock.bad-{version}").write_text(changed)
          PY
          for version in 0.0.0 0.160.0; do
            lock="$work/source/codex-rs/Cargo.lock"
            mv "$lock.bad-$version" "$lock"
            if (codex_check_lock); then
              exit 1
            else
              [ "$?" -eq 1 ]
            fi
          done
