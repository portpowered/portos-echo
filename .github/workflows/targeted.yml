name: A1b exact regression witnesses
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git checkout --detach f87a6038d46487a48b209102efdb285b94fd5cc7
          git rev-parse HEAD
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run unit and exact prebuilt TCP witnesses
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          cargo test --locked -p echo-device --lib
          cargo build --locked -p echo-bridge --bin echo-bridge
          cargo nextest run --locked -p echo-device --test satellite_t3 --run-ignored only --config-file .github/nextest.toml --profile ci --success-output immediate
          printf 'TARGETED_RESULT P-UNIT P-TCP exit=0\n'
          make sim-prereqs
          host=$(sh scripts/hassmic-host.sh path)
          file "$host"
          for flag in --invalid-test-option -S; do
            left=0; right=0
            "$host" -n Lab-Sat "$flag" >"$RUNNER_TEMP/host.out" 2>"$RUNNER_TEMP/host.err" || left=$?
            target/debug/echo-bridge device -n Lab-Sat "$flag" >"$RUNNER_TEMP/dev.out" 2>"$RUNNER_TEMP/dev.err" || right=$?
            test "$left" -eq "$right"
            cmp "$RUNNER_TEMP/host.out" "$RUNNER_TEMP/dev.out"
            cmp "$RUNNER_TEMP/host.err" "$RUNNER_TEMP/dev.err"
            printf 'direct/staged %s status=%s\n' "$flag" "$left"
            cat "$RUNNER_TEMP/dev.out" "$RUNNER_TEMP/dev.err"
          done
          target/debug/echo-bridge device -S -p 17555 -n Lab-Sat | grep -F '<port>17555</port>'
          target/debug/echo-bridge notices | grep -Ex 'hassmic|Port OS hassmic shims|minimp3 \(CC0-1.0\)|monocypher\.c|monocypher\.h|RNNoise'
          cargo nextest run --locked -p echo-bridge --test bridge_t3 --run-ignored only --config-file .github/nextest.toml --profile ci --success-output immediate -E 'test(=hassmic_name::t3_hassmic_name_supervisor_cli)'
          sh tests/hassmic_host_smoke.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_host_teardown.py -v
          cargo nextest run -p echo-wyoming --test wyoming_t3 --run-ignored only --locked --config-file .github/nextest.toml --profile ci --success-output immediate
          printf 'TARGETED_RESULT P-REG components exit=0\n'

      - name: Compare supervised direct and staged -V startup
        run: |
          # -V disables hardware volume control in the fork. Exercise normal startup
          # and take version from Info and the ready log in an isolated loopback.
          cat >"$RUNNER_TEMP/cli-version.py" <<'PY'
          import socket
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path("tests").resolve()))
          from wyoming_host import Host, describe
          direct = Path("target/debug/echo-bridge").resolve()
          version = Path("third_party/hassmic/version").read_text().strip()
          class NoVolumeHost(Host):
              def launch(self, args, **kwargs):
                  if self.direct:
                      args = [str(direct), "device", *args[1:]]
                  super().launch([*args, "-V"], **kwargs)
          for use_direct in (False, True):
              with tempfile.TemporaryDirectory() as folder:
                  host = NoVolumeHost(folder)
                  host.direct = use_direct
                  try:
                      host.start()
                      with socket.create_connection(("127.0.0.1", host.port), timeout=3) as peer:
                          satellite = describe(peer)["satellite"]
                      assert satellite["name"] == "Wyoming Test"
                      assert satellite["version"] == version, satellite
                      assert f"hassmic {version} (".encode() in host.tail, host.tail
                      print(f"{'direct' if use_direct else 'staged'} -V startup: satellite={satellite['name']!r}, version={version}")
                  finally:
                      host.stop()
          PY
          unshare --user --map-root-user --net -- /bin/sh -c 'ip link set lo up && exec "$@"' sh python3 "$RUNNER_TEMP/cli-version.py"
          printf 'TARGETED_RESULT P-CLI exit=0\n'
