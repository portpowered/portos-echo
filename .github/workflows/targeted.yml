name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Ring unit test selection
        type: string
        required: true
permissions:
  contents: read
jobs:
  uplink-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the post-construction ring scope
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          cargo test -p echo-sub-call --locked -- --nocapture
          cargo clippy -p echo-sub-call --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
          root=$(mktemp -d)
          profile() {
            local name=$1
            local binary
            binary=$(cargo test -p echo-sub-call --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "echo_sub_call").executable')
            test -x "$binary"
            valgrind --tool=dhat --num-callers=50 --dhat-out-file="$root/$name.json" \
              "$binary" uplink::tests::fixed_ring_evicts_oldest_and_drains_in_order_in_the_original_storage --exact
          }
          profile baseline
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/echo-sub-call/src/uplink/tests.rs")
          needle = "fn fill_overflow_and_drain(state: &mut State, run: SessionHandle) {\n"
          source = path.read_text()
          assert source.count(needle) == 1
          seed = "    drop(std::hint::black_box(Box::new(std::hint::black_box(1_u64))));\n"
          path.write_text(source.replace(needle, needle + seed))
          PY
          profile seeded
          git restore -- crates/echo-sub-call/src/uplink/tests.rs
          git diff --exit-code
          python3 - "$root" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          counts = {}
          for name in ("baseline", "seeded"):
              profile = json.loads((root / (name + ".json")).read_text())
              frames = profile["ftbl"]
              scope = "uplink::tests::fill_overflow_and_drain"
              hits = [point for point in profile["pps"]
                      if any(scope in frames[index] for index in point["fs"])]
              counts[name] = sum(point["tbk"] for point in hits)
              print(f"ring post-construction {name}: allocations={counts[name]}", flush=True)
          assert counts == {"baseline": 0, "seeded": 1}, counts
          PY
          printf '%s\n' 'TARGETED_RESULT repeat=1 exit=0'
