name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Run the focused template witness
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  eyes:
    if: inputs.release_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.0
          fallback: none
      - name: Run ART, ADB and STATIC
        shell: sh
        run: |
          set -eu
          command -v ffprobe || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          shellcheck scripts/make-template-screenpack.sh scripts/echo-screen-pack.sh
          shfmt -d scripts/make-template-screenpack.sh scripts/echo-screen-pack.sh
          python3 tests/test_screen_pack_assets.py --template-witness "$RUNNER_TEMP/generated"
          (cd "$RUNNER_TEMP/generated" && sha256sum --check template-0.2.0.screenpack.tar.gz.sha256 && cat template-0.2.0.screenpack.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-0.2.0-contact
          path: |
            ${{ runner.temp }}/generated/contact.png
          if-no-files-found: error
      - name: Run existing release-kit regression cases
        run: python3 tests/test_release_kit.py
        if: always()
      - name: Targeted result
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "TARGETED_RESULT repeat=1 exit=0"
          else
            echo "TARGETED_RESULT repeat=1 exit=1"
          fi
