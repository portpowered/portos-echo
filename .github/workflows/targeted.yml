name: Port OS own-client P3 witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit-screen
          sim: 'true'
      - name: Build the shipped screen and install Chromium
        working-directory: web/screen
        run: |
          npm ci
          npx --offline playwright install --with-deps chromium
          npm run build
      - name: Verify paired Settings on the prebuilt bridge
        shell: bash
        run: |
          export ECHO_SCREEN_BUNDLE="$PWD/web/screen/dist/screen.js"
          cargo build --locked --offline -p echo-bridge --bin echo-bridge
          cargo test --locked --offline -p echo-bridge --test bridge_t3 t3_settings_v2_portos_ -- --ignored --nocapture
      - name: Run the screen test suite
        working-directory: web/screen
        run: npm test
      - name: Upload paired Settings viewport captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-portos-settings
          path: ${{ runner.temp }}/own-client-*.png
          if-no-files-found: warn
