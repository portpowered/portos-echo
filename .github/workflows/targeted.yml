name: Targeted lane evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lane-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-rust
      - name: Run declared lints on the clean candidate
        shell: bash
        run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
          npm --prefix web/screen ci --offline=false
          make lint
          printf 'make lint exit=0\n'
          make lint-deps
          printf 'make lint-deps exit=0\n'
