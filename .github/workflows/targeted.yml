name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        type: string
      scenarios:
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: build-host
      - name: Compare Help and Exercise the Vendored TCP Role
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopus-dev zlib1g-dev
          cargo build --locked -p echo-bridge
          HASSMIC_HOST_FROM_FORK=1 sh scripts/hassmic-host.sh build
          export FORK_BINARY
          FORK_BINARY=$(HASSMIC_HOST_FROM_FORK=1 sh scripts/hassmic-host.sh path)
          cargo test --locked -p echo-bridge --test device_cli
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          from subprocess import run
          import sys
          from tempfile import TemporaryDirectory
          bridge = Path("target/debug/echo-bridge").resolve()
          fork = Path(os.environ["FORK_BINARY"])
          for exe, args in ((fork, ["hassmic", "--help"]), (bridge, [str(bridge), "device", "--help"])):
              result = run(args, executable=exe, capture_output=True, text=True)
              print(f"{exe.name}: status={result.returncode} stdout={result.stdout!r}\n{result.stderr}")
              assert result.returncode == 2 and not result.stdout
              if exe == fork:
                  expected = result.stderr
              else:
                  assert result.stderr == expected
          notices = run([bridge, "notices"], capture_output=True, text=True, check=True).stdout
          for label in ["hassmic", "Port OS hassmic shims", "minimp3 (CC0-1.0)", "monocypher.c", "monocypher.h", "RNNoise"]:
              assert f"{label}\n" in notices
              print(f"notices: {label}")
          sys.path.insert(0, str(Path("tests").resolve()))
          from wyoming_host import describe
          capture = runpy.run_path("scripts/capture-wyoming.py")
          Session = capture["Session"]
          original = Session.__enter__.__globals__["subprocess"].Popen
          def launch(args, **kwargs):
              return original([str(bridge), "device", *args[1:]], **kwargs)
          from unittest.mock import patch
          class Device(Session):
              def stage(self):
                  return bridge
          with TemporaryDirectory() as folder, patch.object(capture["subprocess"], "Popen", side_effect=launch):
              with Device(folder) as session:
                  info = describe(session.sock)
                  assert info["satellite"]["name"] == "Capture Echo", info
                  print("info satellite=Capture Echo")
                  session.wake()
                  assert [row["header"]["type"] for row in session.rows][-2:] == ["run-pipeline", "audio-chunk"]
                  audio = session.rows[-1]["header"]
                  pcm = {name: audio["data"][name] for name in ("rate", "width", "channels")}
                  assert pcm == {"rate": 16000, "width": 2, "channels": 1}
                  print(f"run-pipeline -> audio-chunk: {pcm}, {audio['payload_length']} bytes")
              assert session.proc.poll() is not None
          PY
          echo 'TARGETED_RESULT P-CLI exit=0'
          cargo clippy --locked -p echo-device-sys -p echo-device -p echo-bridge -p xtask --all-targets -- -D warnings
          echo 'TARGETED_RESULT focused-clippy exit=0'

