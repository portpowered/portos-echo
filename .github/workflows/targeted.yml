name: Targeted
on:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: Run the production template fixture
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pack:
    if: inputs.release_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-unit
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: screen-${{ runner.os }}-${{ hashFiles('web/screen/package-lock.json') }}
      - name: Prepare original and updated packages
        shell: sh
        run: |
          set -eu
          sh scripts/make-template-screenpack.sh --version 0.2.0 --out "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check template-0.2.0.screenpack.tar.gz.sha256 && cat template-0.2.0.screenpack.tar.gz.sha256)
          git show a7d0f49c:scripts/make-template-screenpack.sh > "$RUNNER_TEMP/old-generator.sh"
          sh "$RUNNER_TEMP/old-generator.sh" --version 0.1.0 --out "$RUNNER_TEMP/older"
      - name: Exercise the production fixture and paired page
        shell: sh
        run: |
          set -eu
          cd web/screen
          npm ci --offline=false
          npm ci --offline
          npx --offline playwright install --with-deps chromium
          FACE_CANDIDATE="$RUNNER_TEMP/candidate" FACE_OLDER="$RUNNER_TEMP/older" npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: template-0.2.0-page
          path: web/screen/test-results/screenshots/template-face-*.png
      - name: Targeted result
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "TARGETED_RESULT repeat=1 exit=0"
          else
            echo "TARGETED_RESULT repeat=1 exit=1"
          fi
