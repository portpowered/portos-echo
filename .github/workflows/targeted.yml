name: A1b exact regression witnesses
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git checkout --detach HEAD^
          git rev-parse HEAD
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: Run full existing sim cohort
        run: |
          unset HASSMIC_HOST_FROM_FORK HASSMIC_SRC
          unset TMPDIR
          make test-sim-scenarios
          printf 'TARGETED_RESULT P-REG scenarios exit=0\n'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: targeted-reports-a1b-full-sim
          path: /tmp/echo-lab-artifacts/artifacts/**/report.json
          if-no-files-found: warn
