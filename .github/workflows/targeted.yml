name: Targeted
on:
  workflow_dispatch:
    inputs:
      nextest_filter:
        description: Optional nextest -E expression
        type: string
        required: false
        default: ''
      scenarios:
        description: Optional space-separated scenario stems or .yaml filenames
        type: string
        required: false
        default: ''
      repeat:
        description: Number of executions, integer 1-10
        type: number
        required: false
        default: 1
      ignored:
        description: Include ignored tests in the filter selection
        type: boolean
        required: false
        default: true
      release_bundle:
        description: Build and verify the distributable release bundle
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  focused-call:
    if: inputs.scenarios != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test-sim
          sim: 'true'
      - name: U2 and P1 call tests
        shell: sh
        run: |
          cargo test -p echo-sub-call --locked -- --nocapture
          cargo nextest run -p echo-bridge --locked --config-file .github/nextest.toml --profile ci -E 'test(/call_audio::tests::capture_/) or test(/voice_source::tests/) or test(/call_media::tests/) or test(/voice_listen_goodbye/)' --success-output immediate
          cargo nextest run -p echo-bridge --test bridge_codex_media --locked --config-file .github/nextest.toml --profile ci --success-output immediate
      - name: M2 with World seed 101
        id: m2
        shell: sh
        run: |
          report_root=$(mktemp -d)
          echo "report_root=$report_root" >> "$GITHUB_OUTPUT"
          make sim-prereqs
          code=0
          ECHO_LAB_WORLD_SEED=101 target/debug/echo-lab run tests/scenarios/m2-live-connect.yaml --driver sim --out "$report_root/m2" || code=$?
          echo "TARGETED_RESULT repeat=1 exit=$code"
          exit "$code"
      - name: Upload the M2 report
        if: always() && steps.m2.outputs.report_root != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: targeted-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.m2.outputs.report_root }}
          retention-days: 3
      - name: P1 bridge T3
        run: make test-sim-bridge
      - name: Verify the counter catches a transient allocation
        shell: sh
        run: |
          set -eu
          file=crates/echo-sub-call/src/uplink/tests.rs
          saved=$(mktemp)
          cp "$file" "$saved"
          trap 'cp "$saved" "$file"; rm -f "$saved"' EXIT
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/echo-sub-call/src/uplink/tests.rs")
          content = path.read_text()
          needle = "fn fill_overflow_and_drain(state: &mut State, run: SessionHandle) {\n"
          assert content.count(needle) == 1
          seed = "    drop(std::hint::black_box(Box::new(std::hint::black_box(1_u64))));\n"
          path.write_text(content.replace(needle, needle + seed))
          PY
          test_name=uplink::tests::fixed_ring_evicts_oldest_and_drains_in_order_in_the_original_storage
          output=$(mktemp)
          code=0
          cargo test -p echo-sub-call --locked "$test_name" -- --exact --nocapture >"$output" 2>&1 || code=$?
          cat "$output"
          test "$code" -eq 101
          rg -F 'uplink allocated after construction' "$output"
          rg -F 'left: 1' "$output"
          rg -F 'right: 0' "$output"
          cp "$saved" "$file"
          git diff --exit-code -- "$file"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-self-tests
      - uses: ./.github/actions/setup
        with:
          target: lint-deps
      - uses: ./.github/actions/setup
        with:
          target: lint-rules
      - name: Provision locked screen npm cache
        run: npm --prefix web/screen ci --offline=false
      - run: make lint
