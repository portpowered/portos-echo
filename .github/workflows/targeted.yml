name: Targeted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: lint-ci-parity
      - name: Check cache contract and its existing test
        shell: sh
        run: |
          make lint-ci-parity
          cargo test --locked -p xtask shared_sim_provisioning_requires_each_exact_host_step
          echo 'TARGETED_RESULT ci-parity test exit=0'
