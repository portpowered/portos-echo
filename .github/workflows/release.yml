name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused diagnostic version
        type: string
        required: true
permissions:
  contents: read
jobs:
  redirect-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real wget regression and complete focused suite
        run: |
          python3 tests/test_release_kit.py
      - name: Seed original downloader and require downgrade rejection test to fail
        run: |
          cp scripts/install.sh /tmp/fixed-install.sh
          git show 7c4981bb:scripts/install.sh > scripts/install.sh
          set +e
          python3 tests/test_release_redirects.py > /tmp/seed-result 2>&1
          code=$?
          set -e
          cp /tmp/fixed-install.sh scripts/install.sh
          cat /tmp/seed-result
          test "$code" -ne 0
          grep -F 'HTTP downgrade was contacted' /tmp/seed-result
          echo 'B1 seeded original downloader: regression detected'
