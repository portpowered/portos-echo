name: Pinned simulation setup
description: Shared host and verified Codex provisioning
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .cache/apt-archives
        key: sim-apt-${{ runner.os }}-v1
    - name: Host build dependencies
      shell: sh
      run: |
        mkdir -p .cache/apt-archives/partial
        if ! { sudo dpkg -i .cache/apt-archives/*.deb && dpkg -s libopus-dev zlib1g-dev >/dev/null; }; then
          sudo apt-get update
          sudo apt-get install -f -y -o Dir::Cache::archives="$PWD/.cache/apt-archives" -o APT::Keep-Downloaded-Packages=true libopus-dev zlib1g-dev
        fi
        sudo chown -R "$(id -u):$(id -g)" .cache/apt-archives
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .cache/hassmic-host
        key: hassmic-host-${{ runner.os }}-${{ hashFiles('hassmic.pin') }}
    - name: Build pinned hassmic-host
      shell: sh
      run: make hassmic-host
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/portos-echo/codex
        key: codex-${{ runner.os }}-${{ hashFiles('codex.pin') }}
    - name: Provision verified pinned Codex
      shell: sh
      run: sh scripts/codex-app-server.sh
    - name: Enable isolated Codex network namespace
      shell: sh
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
