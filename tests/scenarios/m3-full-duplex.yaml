id: m3-full-duplex
milestone: M3
tiers: [T3, T5]
setup: {}
steps:
  - say: "Computer, what time is it?"
  - expect_trace:
      - run.started
  - expect_speech_contains: ["time"]
  - say: "Computer, what day is it?"
  - expect_speech_contains: ["day"]
  - expect_trace:
      - "reply.played {outcome: played}"
  - press: mute
  - expect_screen: {state: muted}
  - say: "Computer, what time is it?"
  - press: mute
  - expect_trace:
      - "mic.mute_window {window_id: mute-1, received_frames: 0, forwarded_frames: 0}"
# Cut, continuation, two playback receipts and strict silence timing are
# checked against independent Wyoming/host PCM receipts by the M3 driver.
budgets:
  reply_send_window_ms: 200
  barge_in_cut_ms: 600
negative: []
