id: m2-live-connect
milestone: M2
tiers: [T3, T4, T5]
setup: {}
steps:
  - say: ../fixtures/lab/w1-utterance.pcm
  - expect_trace:
      - "live.closed {reason: idle, count: 1}"
  - expect_screen:
      sequence:
        - {state: ready, message: "Echo Live ready"}
        - {state: listening}
        - {state: connected}
        - {state: speaking}
        - {state: ready, message: "Echo Live ready"}
        - {state: ready, message: "Echo Live ready"}
budgets: {}
negative:
  - inject: {credential: invalid}
    expect_trace: [auth.relink_required]
    expect_trace_absent: [live.closed]
    expect_screen:
      sequence:
        - {state: error, message: "Run echo-bridge signin with your config, then restart the bridge.", relink: true}
  - inject: {credential: expired}
    expect_trace: [auth.relink_required]
    expect_trace_absent: [live.closed]
    expect_screen:
      sequence:
        - {state: error, message: "Run echo-bridge signin with your config, then restart the bridge.", relink: true}
