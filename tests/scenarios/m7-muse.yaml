id: m7-muse
milestone: M7
tiers: [T3, T4, T5]
setup:
  mcp: spoof
  backend: muse
steps:
  - say: "Computer, ask Muse to run the test job"
  - expect_trace:
      - delegation.created
      - "item/tool/call {name: ask_muse}"
      - muse.submit
      - muse.progress
      - "muse.terminal {status: completed}"
      - "delegation.tool {name: ask_muse, kind: agent}"
  - expect_speech_contains: ["Muse test job completed"]
  - expect_screen: {state: speaking}
budgets: {}
negative:
  - inject: {muse: no_report}
    expect_trace:
      - delegation.created
      - "item/tool/call {name: ask_muse}"
      - muse.submit
      - muse.progress
      - "muse.terminal {status: failed, retryable: false}"
      - "delegation.tool {name: ask_muse, kind: agent}"
    expect_speech_contains: ["Muse did not report a result in time"]
    expect_trace_absent:
      - "muse.terminal {status: completed}"
      - session.delegation.created
      - session.commentary.append
