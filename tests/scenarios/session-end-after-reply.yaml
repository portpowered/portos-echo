id: session-end-after-reply
milestone: M3
tiers: [T3]
setup: {}
steps:
  - say: "Computer, what time is it?"
  - expect_trace:
      - run.started
      - "session.tool_receipt {tool: end_session, outcome: applied}"
      - wyoming.run_ended
# The delegated agent ends the session before anything is voiced. An end
# supersedes everything: the bridge cuts the reply it opened for the turn and
# ends the run at once, without waiting for the turn's answer or idle expiry.
budgets:
  session_listen_seconds: 3
negative: []
