id: session-two-turns
milestone: M3
tiers: [T3]
setup: {}
steps:
  - say: "Computer, what time is it?"
  - say: "Computer, what day is it?"
  - expect_trace:
      - run.started
      - "reply.played {outcome: played, count: 2}"
